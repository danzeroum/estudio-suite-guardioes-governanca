<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo — Estúdio dos Guardiões</title>
<meta name="description" content="Jogo: você é o Encarregado e roteia cada pedido do titular para o direito certo, entre os nove do Art. 18 da LGPD.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦊</text></svg>">
<link rel="stylesheet" href="../motor/css/estudio.css">
<link rel="stylesheet" href="../motor/css/personagens.css">
</head>
<body>

<header class="est-top">
  <a class="est-marca" href="../index.html">🎬 Estúdio dos <strong>Guardiões</strong></a>
  <a class="est-btn" href="player.html">Os filmes</a>
  <button class="est-btn" id="btTema" aria-pressed="false">🌙 Tema escuro</button>
</header>

<main class="est-wrap" style="max-width:900px">
  <h1 style="font-size:24px" id="h1">…</h1>
  <p class="est-nota" style="margin:8px 0 14px">
    <span id="sub"></span><br>
    Teclado: <kbd>1</kbd>–<kbd>9</kbd> respondem direto, <kbd>↑</kbd><kbd>↓</kbd> navegam,
    <kbd>Enter</kbd> confirma e avança.
  </p>

  <div id="palco"></div>
  <p class="est-tempo" id="contador" style="text-align:center;margin-top:8px"></p>
  <p class="est-pedido" id="pedido"></p>
  <div class="est-prazo" id="prazo"></div>
  <div class="est-opcoes" id="opcoes" role="group" aria-label="Os nove direitos do Art. 18"></div>
  <p class="est-feedback" id="feedback"></p>

  <section id="fim" class="est-card" tabindex="-1" hidden>
    <h2 style="font-size:19px">Fim do plantão</h2>
    <p id="placar"></p>
    <p class="est-nota">
      O texto de cada direito é o literal da lei, conferido byte a byte contra a fonte
      canônica que <code>lei.lock</code> ancora.
    </p>
    <p><a class="est-btn" id="deNovo" href="jogo.html">Jogar de novo</a></p>
  </section>

  <p class="est-vh" id="status" role="status"></p>
</main>

<script src="../motor/js/interp.js"></script>
<script src="../motor/js/rig.js"></script>
<script src="../motor/js/rigs/raposa.rig.js"></script>
<script src="../motor/js/cenarios.js"></script>
<script src="../motor/js/palco.js"></script>
<script src="../motor/js/relogio.js"></script>
<script src="../motor/js/carregador.js"></script>
<script src="../motor/js/jogo.js"></script>
<script src="../suite.conf.js"></script>
<script>
(function () {
  var qual = (location.search.match(/[?&]jogo=([\w-]+)/) || [])[1]
             || (window.ESTUDIO_CONF || {}).jogoPadrao;
  var semente = (location.search.match(/[?&]semente=(\d+)/) || [])[1];

  function fatal(msg) {
    var d = document.createElement('div');
    d.className = 'est-erro-fatal';
    d.setAttribute('role', 'alert');
    d.setAttribute('tabindex', '-1');
    d.textContent = 'Estúdio — não foi possível abrir o jogo:\n\n' + msg;
    (document.querySelector('.est-wrap') || document.body).prepend(d);
    d.focus();
  }

  if (!qual) { fatal('Nenhum jogo pedido. Use ?jogo=<id>.'); return; }

  Estudio.carregarJogo(qual, '../').then(function () {
    var j = Estudio.Jogo({
      jogo: qual, palco: 'palco', pedido: 'pedido', opcoes: 'opcoes',
      prazo: 'prazo', feedback: 'feedback', status: 'status', contador: 'contador',
      fim: 'fim', placar: 'placar',
      semente: semente ? parseInt(semente, 10) : undefined
    });
    document.title = j.dados.titulo + ' — Estúdio dos Guardiões';
    document.getElementById('h1').textContent = j.dados.titulo;
    document.getElementById('sub').textContent = j.dados.subtitulo || '';
    document.getElementById('deNovo').href = 'jogo.html?jogo=' + qual;
    document.getElementById('btTema').addEventListener('click', function () {
      var lig = this.getAttribute('aria-pressed') !== 'true';
      this.setAttribute('aria-pressed', String(lig));
      this.textContent = lig ? '☀️ Tema claro' : '🌙 Tema escuro';
      document.documentElement.setAttribute('data-theme', lig ? 'dark' : 'light');
      j.dpo.tema(lig ? 'escuro' : 'claro');
    });
    window.ESTUDIO_JOGO = j;
    document.body.setAttribute('data-pronto', 'sim');
  }).catch(function (e) { fatal(e.message); });
})();
</script>
</body>
</html>
