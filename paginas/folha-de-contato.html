<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Folha de contato — A jornada de um dado pessoal</title>
<meta name="description" content="Os 12 planos do filme dos Guardiões numa tela só, cada um no seu poster, com legenda, guardião responsável e artigo da LGPD.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
<link rel="stylesheet" href="../motor/css/estudio.css">
<link rel="stylesheet" href="../motor/css/personagens.css">
<style>
  .contato{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
  .est-quadro h3{display:flex;gap:8px;align-items:baseline;margin:0}
  .est-quadro .num{font-family:var(--est-mono);font-size:12px;color:var(--est-ink-soft)}
  .est-quadro .leg{padding:10px 16px 16px;font-family:var(--est-head);font-weight:700;
    font-size:14.5px;line-height:1.35;white-space:pre-line;border-top:1px solid var(--est-line);
    margin-top:10px}
  .est-quadro .leg small{display:block;font-family:var(--est-mono);font-weight:600;
    font-size:11.5px;color:var(--est-ink-soft);margin-top:6px;white-space:normal}
  .barra{height:5px}
</style>
</head>
<body>

<header class="est-top">
  <a class="est-marca" href="../index.html">🎬 Estúdio dos <strong>Guardiões</strong></a>
  <a class="est-btn" id="lkPlayer" href="player.html">Ver plano a plano</a>
  <button class="est-btn" id="btTema" aria-pressed="false">🌙 Tema escuro</button>
</header>

<main class="est-wrap">
  <h1 id="h1">Folha de contato</h1>
  <p class="est-nota" style="margin:10px 0 6px;max-width:72ch">
    Cada plano do filme numa tela só, no seu poster. É o <strong>portão da Fase 2</strong>, e a pergunta que ele responde é uma só:
    <strong>a história se lê sem som e sem movimento?</strong> Se sim, vale animar. Se não,
    animar não conserta.
  </p>
  <div class="contato" id="contato"></div>
</main>

<script src="../motor/js/interp.js"></script>
<script src="../motor/js/rig.js"></script>
<script src="../motor/js/rigs/dado.rig.js"></script>
<script src="../motor/js/rigs/raposa.rig.js"></script>
<script src="../motor/js/rigs/coruja.rig.js"></script>
<script src="../motor/js/rigs/aguia.rig.js"></script>
<script src="../motor/js/rigs/tartaruga.rig.js"></script>
<script src="../motor/js/rigs/elefante.rig.js"></script>
<script src="../motor/js/props.js"></script>
<script src="../motor/js/cenarios.js"></script>
<script src="../motor/js/palco.js"></script>
<script src="../motor/js/filme.js"></script>
<script src="../motor/js/carregador.js"></script>
<script src="../suite.conf.js"></script>
<script>
(function () {
  'use strict';
  var qual = (location.search.match(/[?&]filme=([\w-]+)/) || [])[1]
             || (window.ESTUDIO_CONF || {}).filmePadrao;
  var alvo = document.getElementById('contato');
  var filmes = [];

  function fatal(msg) {
    var d = document.createElement('div');
    d.className = 'est-erro-fatal';
    d.setAttribute('role', 'alert');
    d.setAttribute('tabindex', '-1');
    d.textContent = 'Estúdio — o roteiro não pôde ser lido:\n\n' + msg;
    (document.querySelector('.est-wrap') || document.body).prepend(d);
    d.focus();
  }

  Estudio.carregarFilme(qual, '../').then(function () {
    /* Um Filme por quadro: cada um monta o proprio elenco e renderiza um t
       diferente. renderizar(t) e puro, entao nenhum quadro depende da ordem
       em que os outros foram desenhados. */
    var molde = Estudio.Filme.carregar(qual, {});
    document.title = 'Folha de contato — ' + molde.titulo;
    document.getElementById('h1').textContent = 'Folha de contato — ' + molde.titulo;
    document.getElementById('lkPlayer').href = 'player.html?filme=' + qual;

    molde.planos.forEach(function (P, k) {
      var art = document.createElement('article');
      art.className = 'est-quadro';
      var cor = P.guardiao ? 'var(--rig-' + P.guardiao + ')' : 'var(--est-line)';
      var barra = document.createElement('div');
      barra.className = 'barra';
      barra.style.background = cor;
      art.appendChild(barra);
      var h = document.createElement('h3');
      var num = document.createElement('span');
      num.className = 'num';
      num.textContent = String(k + 1).padStart(2, '0');
      h.appendChild(num);
      h.appendChild(document.createTextNode(P.titulo));
      art.appendChild(h);
      var selo = document.createElement('div');
      selo.className = 'selo';
      /* O id do guardiao E o id do rig -- o mapa de identidade que existia
         aqui so escondia esse fato e envelhecia com o elenco. */
      var g = P.guardiao ? Estudio.Rig.definicao(P.guardiao) : null;
      selo.textContent = P.dur + ' s' +
        (g ? ' · ' + g.nome : '') +
        (P.arts.length ? ' · Art. ' + P.arts.join(' e ') : '');
      art.appendChild(selo);
      var box = document.createElement('div');
      art.appendChild(box);
      var leg = document.createElement('div');
      leg.className = 'leg';
      art.appendChild(leg);
      alvo.appendChild(art);

      var palco = Estudio.Palco.criar(box);
      var f = Estudio.Filme.carregar(qual, { palco: palco });
      f.renderizar(P.poster);
      filmes.push(f);
      var L = f.legendaEm(P.poster) || f.legendas.filter(function (x) { return x.plano === P.id; })[0];
      leg.textContent = L ? L.txt : '—';
    });

    document.getElementById('btTema').addEventListener('click', function () {
      var lig = this.getAttribute('aria-pressed') !== 'true';
      this.setAttribute('aria-pressed', String(lig));
      this.textContent = lig ? '☀️ Tema claro' : '🌙 Tema escuro';
      document.documentElement.setAttribute('data-theme', lig ? 'dark' : 'light');
      filmes.forEach(function (f) { f.tema(lig ? 'escuro' : 'claro'); });
    });
    window.ESTUDIO_CONTATO = filmes;
    document.body.setAttribute('data-pronto', 'sim');
  }).catch(function (e) { fatal(e.message); });
})();
</script>
</body>
</html>
