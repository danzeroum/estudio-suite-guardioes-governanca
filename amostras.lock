  # Tartaruga: DECISAO (b) da CP-005 — sem timbre animal, so ritmo.
  # Tartaruga quase nao vocaliza; a busca CC0 nao devolveu gravacao utilizavel
  # (volta tartaruga-pomba e sons sem relacao); portadora de sopro/ambiente
  # seria timbre de ar, nao de personagem. O precedente e o Dado mudo:
  # personagem sem voz nao e falta, e identidade. O ritmo (length_scale) ja e
  # a assinatura sonora dela.
