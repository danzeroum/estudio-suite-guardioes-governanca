# As portadoras do timbre tem ancora, no mesmo espirito do lei.lock e do
# voz.lock.
#
# O timbre da CP-005 e processamento de sinal sobre voz sintetica -- mas a
# materia-prima (a portadora animal) vem de terceiros, e som de terceiro sem
# procedencia e pirataria em potencial. Cada portadora abaixo esta travada por
# sha256: dublar com outra portadora produziria OUTRO timbre do que o revisado
# -- silenciosamente. O que e derivado tem de ser derivavel.
#
# LICENCAS: somente CC0 ou CC-BY (politica completa na CP-005). A licenca de
# cada amostra foi verificada na pagina publica do som no momento deste lock;
# a partir daqui, quem garante a licenca e este arquivo, que so avanca por
# change-proposal. Xeno-canto (NC/ND), BBC Sound Effects (RemArc) e qualquer
# NC ou ND estão proibidos.
#
# A URL ancorada e o PREVIEW publico do CDN do Freesound: dispensa chave de
# API (a API v2 exige token que esta suite nao tem), e a coleta fica
# reproduzivel em qualquer maquina. Os bytes travados sao os do preview.
#
# Para avancar a ancora: change-proposal (caminho protegido). Nunca em
# silencio, porque trocar a portadora muda o timbre de filmes ja publicados.
