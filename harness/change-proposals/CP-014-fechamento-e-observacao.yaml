    observacao_real:
      dispatch: "run 36090788416 (workflow_dispatch, head 5eca95a, 25/09/2026)"
      sorteio: >
        Matrix de 8 do lock: 4 cópias avx2 OBSERVARAM (copia-2/5/6 em AMD
        EPYC 7763, copia-4 em AMD EPYC 9V74 — modelos DIFERENTES), 4 saíram
