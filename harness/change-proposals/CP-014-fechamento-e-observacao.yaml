        CP-012 registrou. Tudo rotulado "observação, sem gate" — nada
        reprova, nada valida; o gate segue sendo bytes do PCM em AVX-512.
    independencia:
      registro: >
        harness/frota/execucoes-gate.json leva as 14 execuções medidas: as
        11 da era CP-013 (10 runs com artefato agregado-frota baixado e
        lido + a tentativa 1 do run 36075600630, a 1ª SEM_AMOSTRA real, com
