      taxa_e_ic: >
        Taxa de SEM_AMOSTRA: 2/14 = 14,29% — acima de 2% no ponto, e o
        quadro mudou de figura com a 2ª ocorrência real: o IC de WILSON
        está INTEIRO acima do limiar ([4,01%; 39,94%] — sozinho, ele
        dispararia); o de CLOPPER-PEARSON ([1,78%; 42,81%]) ainda CRUZA
        2% — por 0,22 pontos. A regra declarada nesta CP exige os DOIS
        ICs acima de 2%: NAO_INDEPENDENTE NÃO dispara — mas o estado é o
        QUASE, registrado com número: uma SEM_AMOSTRA a mais (3 em 15)
        põe os dois ICs acima do limiar e a parada dispara (fronteira
        medida no teste). NADA foi ajustado depois de ver o dado — a
        regra dos dois ICs foi declarada no 1º commit, antes da 2ª
        ocorrência existir; o que o dado mudou foi o ESTADO (de 'IC cruza
        largo' para 'uma ocorrência de distância'), e é isso que fica
        registrado. A vigilância operacional segue dupla: a da CP-013 (3
        disparos SEGUIDOS recalculam o N por CP) e esta fronteira
