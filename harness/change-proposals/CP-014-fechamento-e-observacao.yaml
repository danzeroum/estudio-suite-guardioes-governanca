    - >
      Estado nomeado é o único estado: campo de medição no identidade.json
      é "medido:<valor>", "falhou:<motivo>" ou "nao_aplicavel:<motivo>" —
      nunca texto com "ou", nunca "NAO RODOU" sem causa. Verde por omissão
      não existe; AMBÍGUO por preguiça também não.
    - >
      A independência das cópias é uma hipótese MEDIDA, não assumida: o N
      do lock vale enquanto a frota real se comportar como o modelo
      (binomial, p da fração registrada). O registro das execuções é
      versionado e reproduzível — o número da taxa e da correlação é
      recalculável do registro, nunca afirmado.
    - >
      O #14 não recebe nada além do filme; esta CP não toca
      filmes/relatorio-impacto/**. O force-with-lease é só no rebasing
      das branches de trabalho; o main nunca vê force.

  paradas_nomeadas:
    NAO_INDEPENDENTE:
      status: "vigilância ativa no cálculo de independência"
      regra: >
        Taxa observada de SEM_AMOSTRA acima de 2% com IC de 95% acima de
        2% (limite inferior acima de 2%): registrar, recalcular N a partir
        da taxa observada e propor — sem aplicar sozinho se o N subir mais
        de 50%. Correlação intra-execução sobredispersa (variância das
        cópias AVX-512 por execução acima da binomial) é o mesmo achado
        por outro número: as cópias de um mesmo run não são sorteios
        independentes, e o N perfeito por run não salva o risco por run.
    MAIN_QUEBROU:
      status: "vigilância ativa em cada merge"
      regra: >
        CI do main vermelho após o merge: git revert -m 1 no main, job
