  resultado_da_medicao:
    quando: "2026-09-25 (gate no head do PR, dispatch manual, registro das 11 execuções da era CP-013)"
    fechamento_no_main:
      cherry_pick: >
        b4e59fb (o único commit só de CP-013/frota no #14 — confere arquivo
