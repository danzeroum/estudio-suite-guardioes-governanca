      correlacao_intra_execucao: >
        Cópias AVX-512 por execução comparadas à binomial(N=8, p=38/97):
        variância observada 2,29 x binomial 1,91 — qui-quadrado de
        dispersão 15,59 em 13 g.l., p=0,27: SEM SOBREDISPERSÃO, as cópias
        de um mesmo run seguem sorteios independentes (a independência
        que o N pressupõe foi conferida com 14 execuções, não assumida).
        A MÉDIA é o achado persistente: 30/112 cópias com avx512f =
        26,8% na era CP-013/014, contra 38/97 = 39,2% do lock (cauda
        binomial 0,0041) — a fração da frota MEDIDA ficou abaixo da
        fração do registro das CPs 009/011/012, e as duas SEM_AMOSTRA em
        14 disparos são exatamente o que a fração observada prevê
        (P(zero) = 8,9% por disparo com N=8: ~1,25 em 14 esperado, 2
        observado — consistente). Pool vivo. Se a tendência se confirmar,
        o N sai de 8 para 13 (+62,5%) — acima dos 50%: aplicação
        unilateral proibida, proposta por CP quando o dado sustentar.
      registro_em_producao: >
        O agregador publica a entrada de registro no agregado.json de todo
        run (medido nos runs 36090778482 e 36091333340 t2:
        run/tentativa/head/evento/quando/copias/avx512/sem_amostra); o
        curador a acrescenta ao registro por PR de manutenção — commit
        automático no main, JAMAIS. Nota medida: no evento pull_request o
