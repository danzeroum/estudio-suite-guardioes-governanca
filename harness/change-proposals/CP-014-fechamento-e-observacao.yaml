      deltas_por_fala: >
        As 4 cópias — CPUs AMD de dois modelos — devolveram deltas
        IDÊNTICOS fala a fala: a divergência da classe avx2 contra a
        âncora é DETERMINÍSTICA na classe, não ruído por máquina (achado
