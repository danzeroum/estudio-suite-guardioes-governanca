      teste local era ruído, não evidência — revertido junto.
    o_vermelho_nomeado_funcionou_segunda_vez: >
      A 2ª SEM_AMOSTRA real veio no commit de fechamento DESTE PR (8/8
      avx2 no sorteio): o agregador reprovou vermelho nomeado, o rerun
      devolveu o verde (4 AVX-512 idênticas), e a ocorrência ENTROU no
      registro — porque excluí-la seria escolher o dado que favorece a
      conclusão confortável. Com ela, o quadro ficou honestamente
      desconfortável: o Wilson dispara sozinho, o CP cruza por 0,22
      pontos, e a parada NAO_INDEPENDENTE está a uma ocorrência de
      distância — registrada com fronteira medida, sem ajustar regra
      nenhuma depois de ver o número.

  doutrina:
    - >
      O gate continua sendo SÓ bytes do PCM mixado em cópia AVX-512
      visível (decisão (e) da CP-013, intocada); nenhum .opus commitado
      muda; nenhum teto de descritor entra no lock. A observação AVX2 é
