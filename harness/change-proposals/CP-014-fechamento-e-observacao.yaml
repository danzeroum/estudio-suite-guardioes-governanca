# Mudanca proposta a partir de DIRETIVA DO DONO sobre EVIDENCIA medida.
# Declarada antes de executada; fica como registro mesmo depois.
#
# A CP-013 fechou com a frota COMPROVADA e a parada AGUARDANDO_LEI — mas o
# FECHAMENTO dela (a tabela da frota, a ocorrência de SEM_AMOSTRA_DECISIVA)
# commitou na branch do #14 (b4e59fb), onde só deveriam morar os commits do
# filme. O dono viu o estado e mandou arrumar a casa:
#
#   DIRETIVA DO DONO (25/09/2026):
#   "CP-014: levar ao main o fechamento da CP-013 que ficou na branch do
#    #14; tirar do #14 tudo que não é do filme; corrigir a observação AVX2
#    e os rótulos do identidade.json; monitorar a independência das cópias."
#
# O que a diretiva corrige, cada ponta com o porquê medido:
#
#   (1) O FECHAMENTO PERTENCE AO MAIN. A CP-013 encerrou-com-parada — o
#   registro do encerramento é da CP, não do PR do filme que espera a lei.
#   O cherry-pick do fechamento para uma branch nova (esta) leva ao main
#   a tabela da frota e a ocorrência de SEM_AMOSTRA_DECISIVA; o #14 perde
#   o commit e volta a conter SÓ o filme.
#
#   (2) A OBSERVAÇÃO DA ÂNCORA NO GATE NÃO INFORMA. Toda cópia avx2 media
#   O MESMO ARQUIVO commitado — a âncora é uma só, independente de classe
#   (a CP-011 isolou isso; 33 cópias mediram valores idênticos entre si e
#   iguais à medição local). Medir o mesmo arquivo em toda cópia não traz
#   informação: a observação sai do gate inteira. A cópia avx2 no gate
#   passa a sair cedo SEM instalar audio-suite e SEM medir a âncora — só
#   classifica, publica identidade e veredito, e termina neutra. A
#   observação de verdade — a que INFORMA — compara o REGENERADO contra a
#   âncora, fala a fala, e isso exige build: vira dispatch MANUAL
#   (observar_avx2), disparado quando se quer olhar, nunca em todo PR.
#
#   (3) RÓTULOS ÚNICOS. O identidade.json da CP-013 carregava estados
#   ambíguos: "copia avx2 (sem build, CP-013) ou DIVERGENTE" (texto com
#   "ou" — dois estados numa string), "NAO RODOU", "nao medida", "NAO
#   REGISTRADO". Cada campo passa a ter UM estado nomeado: "medido:<valor>",
#   "falhou:<motivo>" ou "nao_aplicavel:<motivo>" — e o artefato avx2
#   declara os campos de síntese como "nao_aplicavel:classe_avx2". Campo
#   com "ou" reprova na geração: rótulo ambíguo não publica.
#
#   (4) INDEPENDÊNCIA DAS CÓPIAS. O N=8 do lock nasceu de P(zero AVX-512)
#   <= 2% com a fração 38/97 — MAS a frota é um pool vivo e as 11
#   execuções reais do gate da CP-013 têm de ser conferidas contra o
#   próprio modelo: taxa observada de SEM_AMOSTRA com IC de 95%, e a
#   correlação intra-execução (cópias AVX-512 por execução comparadas à
#   binomial com p = 38/97). Taxa acima de 2% COM o IC acima de 2% =
#   NAO_INDEPENDENTE: registrar e propor novo N a partir da taxa observada
#   — sem aplicar sozinho se o N subir mais de 50%. O registro é
#   versionado em harness/frota/, atualizado por PR de manutenção; nada
#   de commit automático no main.
schema: estudio-suite/change-proposal@1

proposta:
  id: CP-014
  titulo: "Fechamento da CP-013 no main; #14 só com o filme; observação AVX2 vira dispatch manual; rótulos únicos no identidade.json; independência das cópias monitorada"
