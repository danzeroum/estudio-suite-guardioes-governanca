# Mudanca proposta a partir de EVIDENCIA, nao de gosto.
# Declarada antes de executada; fica como registro mesmo depois.
#
# A CP-010 fecha o que a CP-006 deixou declarado e nao aplicado: os rigs
# dizem 'mais-grave', 'medio-grave', 'medio', 'mais-agudo', e a voz de
# todos sai na MESMA altura. Esta CP so PROPOE e MEDE (prototipo fora do
# dublar); a execucao e sprint propria, depois do PR #12 e do descritor
# pitch_f0 da audio-suite (danzeroum/audio-suite#44).
schema: estudio-suite/change-proposal@1

proposta:
  id: CP-010
  titulo: "Pitch por guardiao: alvos de F0 medidos, nao adjetivos"
  autor: agente/curador (Agente B)
  criada_em: "2026-09-24T06:30:00Z"
  estado: proposta              # nada executado; merge e decisao humana
  depende_de:
    - "PR #12 do estudio (Sprint 12 / CP-008) mergeado -- zona do dublar, voz.lock, filmes/*/audio"
    - "danzeroum/audio-suite#44 (descritor pitch_f0, AS-DESC-008) mergeado e pinado no CI"

  sinal:
    tipo: dado-inerte-com-cliente
    chave: "pitch-declarado-nao-aplicado"
    evidencia: >
      Medido com o descritor pitch_f0 (YIN, quadros vozeados) da audio-suite
      sobre as baselines da carteira de voz (filmes/<id>/baseline/vozes/,
      main 6608628): as 10 vozes dos dois filmes tem F0 mediana entre
      156,95 e 173,73 Hz -- 1,8 semitom do extremo ao extremo, com o
      Elefante 'mais-grave' (173,73 Hz na jornada) ACIMA do narrador
      'medio' (156,95 Hz). O descritor de altura que a carteira usa hoje,
      pitch_stab.pitch_drift_cents, da 4.851-5.456 cents para TODOS e nao
      separa nada (nao decide vozeamento). Causa: um unico modelo
      (pt_BR-faber-medium) e pitch_aplicado: false no audio.json -- o
      timbre da CP-005 muda a cor, nao a F0. O dado (rig.voz.pitch) existe
      e nao tem cliente; a tela diz 'o grave e o Elefante' e o som nao
      confirma.

  doutrina:                    # herdada; nada aqui e negociavel
    - >
      Camada aditiva e ordem fixa da CP-006: fala -> piper -> PROSODIA
      (pitch entra aqui) -> timbre -> mix. Categoria 'medio' com expressao
      neutra devolve a voz ATUAL byte a byte (deslocamento 0 = retorno do
      pcm intocado, por construcao nas duas tecnicas do prototipo).
    - >
      Time-stretch continua PROIBIDO: o deslocamento de F0 preserva o
      numero de amostras de cada clipe (medido: duracao identica em 12/12
      falas das duas tecnicas).
    - >
      Determinismo total: mesma entrada -> mesmos bytes, sem semente.
    - >
      O alvo e NUMERO derivado de medicao; o adjetivo do rig so da a ORDEM.
      Medida pela audio-suite (CLI externa, codigo nunca copiado); descritor
      nunca reprova (R1) -- quem reprova e o fiscal da suite com criterio
      declarado nesta CP.
    - >
      noise_scale NAO SE TOCA (CP-004). Modelo e ambiente so avancam por CP.

  medicao:
    medidor: "audio-suite pitch_f0 (AS-DESC-008) @ danzeroum/audio-suite#44, commit edb73f0"
    prototipo: "harness/prototipos/cp010/prototipo.py (ver README.md ao lado)"
    frases: "3 frases neutras iguais para todos (a comparacao isola a voz)"
    referencia_hz: 166.0            # mediana das medianas atuais do prototipo
    derivacao_do_passo: >
      sigma_frase = 0,44 st (desvio da mediana da MESMA voz entre 7 frases,
      3 falantes; max 0,90 st). Separar duas vozes em 2 sigma numa frase
      isolada: 2*sqrt(2)*sigma_frase = 1,24 st. Mais o erro da tecnica nos
      dois lados (WORLD 2 x 0,60 st, pior medido): 2,44 st -> passo de
      2,5 st entre categorias adjacentes. Ancora 'medio' = a referencia
      MEDIDA, para que narrador e coruja nao sejam processados.
    alvos_st:                        # dado: harness/prototipos/cp010/alvos.yaml
      mais-grave: -5.0
      medio-grave: -2.5
      medio: 0.0
      mais-agudo: 2.5
    tabela: |
      F0 mediana em Hz (pitch_f0). "filmes" = baseline da carteira hoje
      (jornada / legitimo). "atual" = prototipo sem deslocamento, apos timbre.
      Depois = apos deslocamento + timbre do rig; erro em cents vs. alvo.

      guardiao   declarado    filmes (Hz)      atual  alvo st  alvo Hz  WORLD (erro)    PSOLA (erro)
      elefante   mais-grave   173,73 / 167,47  165,88  -5,0    124,36   124,03 (-4 c)   125,67 (+18 c)
      aguia      medio-grave  170,70 / --      170,56  -2,5    143,71   142,09 (-19 c)  140,77 (-35 c)
      tartaruga  medio-grave  171,42 / 163,37  165,76  -2,5    143,71   143,07 (-7 c)   143,57 (-1 c)
      coruja     medio        169,19 / 162,53  166,11   0,0    166,00   165,70 (-3 c)   167,42 (+15 c)
      narrador   medio        156,95 / 163,89  165,57   0,0    166,00   164,17 (-19 c)  167,45 (+15 c)
      raposa     mais-agudo   173,22 / --      167,59  +2,5    191,75   197,06 (+47 c)  199,04 (+64 c)

      Distancia entre guardioes (st, |12*log2(Fa/Fb)|):
      par                    hoje   WORLD  PSOLA   categorias
      elefante ~ aguia       0,48   2,35   1,96    adjacentes
      elefante ~ tartaruga   0,01   2,47   2,31    adjacentes
      aguia ~ coruja         0,46   2,66   3,00    adjacentes
      tartaruga ~ coruja     0,04   2,54   2,66    adjacentes
      tartaruga ~ narrador   0,02   2,38   2,66    adjacentes
      coruja ~ raposa        0,15   3,00   3,00    adjacentes
      narrador ~ raposa      0,21   3,16   2,99    adjacentes
      elefante ~ raposa      0,18   8,02   7,96    extremos
      aguia ~ tartaruga      0,49   0,12   0,34    MESMA categoria
      coruja ~ narrador      0,06   0,16   0,00    MESMA categoria
      menor distancia entre categorias adjacentes: hoje 0,01 -> WORLD 2,35 / PSOLA 1,96

      Leitura honesta: o erro apos o timbre (ate 64 c, Raposa -- a portadora
      do latido puxa a F0 para cima) e maior que antes dele (<= 16 c PSOLA
      em fala crua); por isso uma distancia adjacente mediu 1,96 st, abaixo
      do passo nominal 2,5 mas acima do limiar de separabilidade 1,24 st.
    alternativa_modelos: |
      F0 mediana das mesmas 3 frases, sem DSP, noise 0 (pt_BR do piper-voices):
        pt_BR-faber-medium   ~166 Hz  (o do voz.lock)
        pt_BR-edresson-low   159,80 Hz (16 kHz; "low")
        pt_BR-jeff-medium    155,67 Hz
        pt_BR-cadu-medium    132,07 Hz (-3,9 st do faber)
      Todos masculinos: modelos diferentes dao no maximo 2 niveis distantes
      (faber x cadu), nao 4; e o log do piper acusou "Missing phoneme from
      id map" em um deles -- risco de pronuncia.

  alternativas:
    A_world:
      o_que: "pyworld (WORLD: harvest + cheaptrick + d4c; F0 x razao; ressintese)"
      medido: "erro apos timbre -19..+47 c; duracao preservada; 2x no mesmo processo identico"
      custo: >
        Dependencia nova COMPILADA (C++) no ambiente de sintese: avancar
        voz.lock (bloco ambiente) e a imagem dubladora do PR #12. E a
        dependencia que a CP-006 deixou "a ser aprovada".
      risco_determinismo: >
        A ressintese do WORLD injeta ruido na componente aperiodica. Medido
        identico 2x no mesmo processo e entre processos (ver como_se_prova);
        entre MAQUINAS (build C++ e libm diferentes) nao foi medido -- e o
        mesmo risco que a CP-007 resolveu travando versoes.
    B_psola:
      o_que: "TD-PSOLA em numpy/scipy (marcas de pitch pela F0 do YIN)"
      medido: "erro apos timbre -35..+64 c; em fala crua <= 16 c; duracao preservada; deterministico"
      custo: >
        Nenhuma dependencia nova: numpy e scipy ja estao no bloco ambiente
        do voz.lock. Exige rastreador de F0 PROPRIO na suite (o prototipo
        usa o YIN da audio-suite, que e CLI externa e nao pode virar
        import do estudio): ~80 linhas, testadas contra a audio-suite.
      risco_determinismo: "baixo: aritmetica fixa sobre numpy/scipy ja travados."
      risco_qualidade: >
        PSOLA e mais sujeito a artefato (aspereza) que o WORLD em deslocamentos
        grandes (o Elefante vai a -5 st). NAO MEDIDO por descritor --
        exige escuta humana das amostras regeraveis.
    C_modelos:
      o_que: "um modelo piper por guardiao"
      medido: "132-166 Hz entre os 4 modelos pt_BR; so 2 niveis uteis"
      custo: "N ancoras novas no voz.lock (sha por modelo), N vezes o download, pronuncia diferente por guardiao"
      veredito: "nao atende sozinho; descartada como tecnica principal"
    recomendacao: >
      B (PSOLA), porque nao avanca o ambiente do voz.lock e e deterministica
      por construcao -- CONDICIONADA a escuta humana das amostras (A e B
      ficam regeraveis em workspace/cp010/amostras/). Se a escuta reprovar
      o PSOLA no Elefante (-5 st), A (WORLD) com o pyworld travado no
      voz.lock, por PR proprio.

  escopo:
    sprint_execucao: >
      (depois do merge do PR #12 e de audio-suite#44)
      1. estudio_suite/pitch.py: deslocamento de F0 da tecnica aprovada +
         rastreador de F0 proprio (se B), puro, deterministico.
      2. Mapa categoria -> semitons como DADO em estudio_suite (no espirito
         do mapa de prosodia da CP-006); o rig continua declarando so o
         adjetivo -- motor/ nao muda.
      3. dublar: pitch do guardiao + pitch_st da expressao (CP-006) somados
         na etapa de prosodia; audio.json com pitch_aplicado: true e o
         deslocamento efetivo por clipe.
      4. harness/perfis/guardioes-vozes.yaml ganha pitch_f0; a carteira
         passa a publicar F0 mediana por falante.
      5. Redublagem dos filmes publicados + carteira regravada (--gravar),
         diffs no PR.
    fora: >
      Trocar modelo (C), reabrir noise_scale, mexer no timbre, pitch por
      registro diferente do declarado.

  impacto:
    - "estudio_suite/{pitch(novo),prosodia,dublar}.py :: deslocamento na etapa de prosodia"
    - "voz.lock :: SO se a opcao A for escolhida (pyworld no bloco ambiente)"
    - "harness/perfis/guardioes-vozes.yaml :: descritor pitch_f0"
    - "ci/ + .github/ :: pin da audio-suite num SHA que tenha o pitch_f0"
    - "filmes/*/audio/, filmes/*/baseline/vozes/, filmes/*/relatorio.json :: redublagem"
    - "tests/test_{prosodia,dublar,vozes}.py :: casos novos"

  caminhos_afetados:
    - esta-suite :: estudio_suite/{pitch,prosodia,dublar}.py
    - esta-suite :: harness/perfis/guardioes-vozes.yaml
    - esta-suite :: ci/, .github/workflows/ (pin da audio-suite)
    - esta-suite :: filmes/*/audio/, filmes/*/baseline/vozes/, filmes/*/relatorio.json
    - esta-suite :: tests/
    - esta-suite :: voz.lock (somente opcao A)

  risco:
    nivel: medio
    porque: >
      Muda a voz de filmes ja publicados, e toca a zona que o Sprint 12
      (PR #12) esta mexendo agora: dublar, voz.lock, imagem dubladora,
      filmes/*/audio. Contencao: (1) nada disso e executado por esta CP --
      ela so propoe e mede, fora do dublar; (2) a execucao espera o merge
      do PR #12 e e rebaseada sobre ele; (3) 'medio' + neutro fica
      byte-identico, entao a regressao se limita aos guardioes deslocados;
      (4) o criterio de aceite e numerico e medido pela audio-suite.
    riscos_locks:
      - "voz.lock/modelo: intocado nas opcoes A e B"
      - "voz.lock/ambiente: intocado em B; +pyworld (versao travada) em A"
      - "amostras.lock: intocado (timbre nao muda)"
      - "lei.lock: sem relacao"

  aval_humano_necessario: true   # merge do PR e decisao humana

  como_se_prova:
    - "prototipo roda do zero com um comando (README.md de harness/prototipos/cp010) num venv isolado; amostras e resultado em workspace/cp010/ (gitignored)"
    - "duas execucoes (venvs e workspaces diferentes) -> resultado.json identico e sha256 das amostras identicos"
    - "cada guardiao: |F0 mediana medida - alvo| <= 65 cents apos o timbre (pior medido no prototipo: 64 c)"
    - "categorias adjacentes: distancia medida >= 1,24 st (2*sqrt(2)*sigma_frase); hoje e 0,01"
    - "deslocamento 0: pcm devolvido intocado (byte a byte) -- narrador e coruja nao mudam"
    - "duracao de cada clipe identica antes e depois do deslocamento"
    - "dublar 2x no sprint de execucao -> sha256 identicos em todos os .opus"

  pontos_de_decisao:
    - "Tecnica: B (PSOLA, recomendada, condicionada a escuta) ou A (WORLD, +pyworld no voz.lock)."
    - "Pares na MESMA categoria (aguia~tartaruga, coruja~narrador) medem 0,0-0,3 st: aceitar (timbre e ritmo os distinguem) ou subdividir as categorias (aumenta a faixa alem de +-5 st)."
    - "Raposa: registro 'encarregado' declara 'medio' e 'titular' 'mais-agudo' -- pitch por registro (como o ritmo ja e) ou so pelo rig."
    - "Onde mora o mapa categoria -> semitons: estudio_suite (proposto) ou no rig (motor/, protegido)."

  backlog:                      # PROIBIDO nesta CP
    - "Contorno de F0 dentro da frase (entonacao) -- so a mediana e alvo aqui."
    - "Modelo por guardiao (alternativa C)."
    - resposta_padrao: >
        Se um revisor perguntar por esses itens: "backlog da CP-010" --
        nao e esquecimento.
