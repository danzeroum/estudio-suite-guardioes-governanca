# Mudanca proposta a partir de DECISAO DO DONO sobre EVIDENCIA medida.
# Declarada antes de executada; fica como registro mesmo depois.
#
# A CP-011 fechou com duas paradas ativas e DEVOLVIDAS ao dono:
# CLASSE_MAL_DEFINIDA (nenhuma flag SIMD separa quem reproduz o byte —
# a divergencia do codificador opus e por FAMILIA de CPU, com a mesma
# entrada f32) e RESIDUO_AUDIVEL (o residuo avx2 de -38 dBFS nao cabe
# sob teto abaixo de -60). O dono DECIDIU (24/09/2026):
#
#   "prova de bytes no PCM mixado; codec por tolerancia decodificada;
#    AVX2 por equivalencia de descritores com controle positivo"
#
# A decisao move o ponto da prova de bytes do .opus (que a frota nao
# entrega igual entre familias) para o PCM MIXADO pre-opus (que a frota
# entrega igual em TODA classe com avx512f visivel — Intel e AMD,
# medido em 4 amostras da CP-011, s16 E f32); aceita o codificador opus
# como divergente-por-familia sob TETO decodificado (o maximo observado
# em AMD-avx512 e -80,9 dBFS, bem abaixo do piso de -60); e troca a
# pergunta na classe avx2: em vez de null test (cujo residuo alto e
# aritmetica de rede neural, nao audivel necessariamente), a classe e
# VALIDADA por descritores por fala — com CONTROLE POSITIVO provando
# que os tetos escolhidos ainda enxergam mudanca real.
#
# Esta CP executa a decisao e a prova na frota; depois, pelo rito do
# adendo, conduz os merges #12 -> #13 -> #14 (um por vez, sem --admin,
# sem force-push; o #14 so com a lei conferida ou AGUARDANDO_LEI).
schema: estudio-suite/change-proposal@1

proposta:
  id: CP-012
  titulo: "A prova certa por etapa: bytes no PCM mixado, codec por tolerancia decodificada, AVX2 por descritores com controle positivo"
  autor: agente/curador
  criada_em: "2026-09-25T00:00:00Z"
  # ENCERRADA COM PARADA ATIVA (TETO_NAO_DISCRIMINA): a medição da frota
  # provou que NÃO EXISTE teto de F0 mediana que aceite a classe avx2 E
  # pegue o controle de +20 cents — a divergência avx2 move o F0 mediano
  # por fala em até ~2,2 Hz (medido, falas estáveis) e o controle desloca
  # ~2,0-2,9 Hz: o sinal do controle está NO NÍVEL do ruído da própria
  # frota (e uma fala de timbre misto mede 42,1 Hz de delta porque o
  # instrumento é instável NELA — p10-p90 de 132,85-478,42 Hz na própria
  # âncora). A regra da CP manda PARE; a decisão volta ao dono com as
  # saídas medidas. A prova das classes avx512 (a decisão do dono) está
  # VERDE e medida na frota: PCM idêntico + codec sob teto + controle
  # reprovando, Intel e AMD.
  # ENCERRADA COM SUCESSORA: a DECISAO DO DONO (24/09/2026, saida (e)
  # — "a prova decisiva e bytes do PCM mixado em copia AVX-512 visivel;
  # AVX2 e observacao; sem amostra decisiva e vermelho nomeado") resolveu
  # a parada TETO_NAO_DISCRIMINA SEM ajustar instrumento ou controle:
  # nenhum teto de descritor entra no lock como gate, a classe avx2 sai
  # do gate como observacao publicada e a pergunta do nivel de erro de
  # pitch que a validacao avx2 teria de enxergar deixa de ser pergunta
  # de GATE — os numeros medidos (o caminho avx2 varia a altura em
  # ~10-25 cents por fala; 42,1 Hz na fala de instrumento instavel)
  # seguem registrados aqui, na issue do audio-suite e na CP-010
  # (contexto dos passos de 2,5 st), como observacao.
  estado: encerrada-com-sucessora
  sucessora: CP-013

  sinal:
    tipo: decisao-do-dono-sobre-evidencia-medida
    chave: "cp011-paradas-resolvidas-por-decisao-pcm-codec-descritores"
    evidencia: >
      CP-011, 28 execucoes com hash POR ETAPA: (1) entre AVX-512 e AVX2
      a divergencia nasce no PCM CRU (30/30 falas, onnxruntime/MLAS) —
      residuo decodificado -38,4/-38,2 dBFS; (2) entre familias com
      avx512f VISIVEL, o PCM (cru, pos-prosodia, pos-timbre, mix s16 E
      mix f32) e IDENTICO e o .opus diverge DENTRO da codificacao
      (-80,9/-83,1 dBFS, mesmo binario pinado); (3) Intel reproduz
      byte a byte 6/6 (8573C e 6973P-C, duas geracoes). Nenhuma flag
      SIMD separa reprodutores de divergentes (doze flags de plataforma
      separam — fabricante disforcado, vedado). Duracoes identicas em
      TODAS as execucoes, em todas as classes.
    decisao_do_dono: >
      24/09/2026, registrada na abertura desta CP: "prova de bytes no
      PCM mixado; codec por tolerancia decodificada; AVX2 por
      equivalencia de descritores com controle positivo". A decisao
      resolve as duas paradas da CP-011 SEM tocar em doutrina alheia:
      nenhum .opus commitado muda (o canônico continua sendo o HEAD); a
      verificacao (bytes) e a validacao (tolerancia/descritores) seguem
      provas separadas, cada veredito carregando classe, etapa
      comparada, prova aplicada e numeros.

  plano:
    - >
      1. HASH CANONICO NO PCM: o audio.json passa a registrar o sha256
      do mix PCM f32 (a entrada EXATA do codificador, validada por
      round-trip na CP-011), gerado da MESMA dublagem que produziu os
      .opus commitados. f32, nao s16, porque a medição da CP-011 mostrou
      os DOIS estaveis entre Intel e AMD-avx512 — e o f32 e o
      instrumento mais fino: o s16 tem piso de 1 LSB e o 9V45 entregou
      mix s16 identico com .opus divergente; ancorar em s16 seria
      ancorar numa foto que esconde o que o libopus le. Nenhum .opus
      muda; o fiscal de redublagem e o job comparam ESSE hash.
    - >
      2. CLASSES AVX-512 (Intel e AMD): o job exige o mix PCM
      byte-identico (o hash do audio.json); o .opus e decodificado e
      comparado com o decodificado do HEAD sob TETO de nulidade derivado
      da frota (maximo observado em AMD-avx512 com margem declarada,
      abaixo de -60 dBFS). O log diz "PCM identico; codec dentro do
      teto X". PCM divergente na classe avx512 e VERMELHO nomeado.
    - >
      3. CLASSE AVX2: equivalencia por DESCRITORES, por fala — duracao
      exata, loudness, F0 mediana (pitch_f0, AS-DESC-008) e centroide
      espectral, via audio-suite. Os tetos sao DERIVADOS da frota AVX2
      contra a ancora (maximo observado + margem declarada) e moram num
      so lugar (voz.lock, bloco tolerancia). CONTROLE POSITIVO
      obrigatorio em toda execucao: variantes deliberadas (+0,5 dB numa
      fala, +20 cents numa fala, uma fala trocada por outra do mesmo
      guardiao, 50 ms de corte) tem de REPROVAR com os tetos escolhidos,
      nomeando o descritor. Teto que aceita a frota e nao pega todos os
      controles: TETO_NAO_DISCRIMINA (PARE). O log diz "PCM diferente
      (classe avx2); equivalente por descritores: <numeros>".
    - >
      4. PROVA NA FROTA: rodadas ate no minimo 3 Intel, 3 AMD-avx512 e
      3 AMD-avx2 VERDES, com teto de 40 execucoes; cada execucao com
      classe, prova aplicada e numeros na tabela da CP. Em cada
      execucao os controles positivos rodam e reprovam. Classe sem 3
      amostras em 40: AMOSTRA_INSUFICIENTE:<classe>, sem merge.
    - >
      5. MERGE do #12 pelo rito do adendo: CP-008/009/011/012 sem
      parada ativa, checks verdes no head exato, atualizado com o main,
      sem --admin, sem force-push. Depois, CI do main verde — ou
      reverter com git revert -m 1 e MAIN_QUEBROU.
    - >
      6. #13 depois do #12: rebase, CI verde, merge commit. A CP-010
      CONTINUA proposta — tecnica e escuta sao decisao do dono; o kit
      de audicao do Agente B fica citado no PR.
    - >
      7. #14 depois do #12: rebase, sincronizar_derivados (README), a
      secao do test_navegador provada pelo B e o controle negativo de
      novo. NENHUM merge enquanto roteiro e storyboard nao estiverem
      verdes com LEI_TOKEN e os artigos 38 e 10 nao conferidos contra o
      lei.lock. Sem LEI_TOKEN: PR pronto e AGUARDANDO_LEI.

  resultado_da_medicao:
    quando: "fase 1 (maquinaria) local: 2026-09-25; frota: a preencher"
    base_herdada_da_cp011: >
      Teto do codec derivado da frota JA medida na CP-011: maximo
      observado em AMD-avx512 = -80,9 dBFS (jornada-dado; -83,1 no
      legitimo-interesse; 4 amostras: 9V45 x3, 9V74-visivel x1, numeros
      identicos entre execucoes) + margem declarada de 6 dB (quase 3x a
      dispersao observada de 2,2 dB entre os filmes) = teto -74,9 dBFS,
      abaixo do piso de -60. A base e MEDIDA, herda de CP-011 e sera
      reconfirmada nas execucoes desta CP no head novo.
    medicao_na_frota_2026_09_24: >
      Runs 36056369068 (PR, 1 copia, 4a134c4 — achou o bug latente do
      caminho do container), 36056391429 (dispatch, 12 copias, 4a134c4
      — a prova da imagem rodou e foi VERDE na avx512 antes do tropeço),
      36056994002 (dispatch, 10 copias, cc84eb2 — achou o ffmpeg ausente
      no runner e colheu os deltas), 36056989353 (PR, 1, cc84eb2) e
      36058080095 + 36058085332 (dispatch 10 + PR 1, 4094552 — a coleta
      completa, controles medidos em runners reais). 35 execuções no
      total, 3 dispatches cancelados no incio da sessao (artefato de
      retry duplicado do agente, registrado aqui porque a frota nao e
      gratis); a prova de bytes no PCM e o controle do codec
      confirmados em TODAS as que rodaram.
    tabela_frota:
      - {copia: "2, 9", cpu: "Intel Xeon Platinum", classe: avx512, pcm: "IGUAL", res_codec_dbfs: "-inf / -inf", controle_codec_dbfs: "-68,9 / -68,9", veredito: "verde na prova da imagem (bytes .opus 19/19 identicos)"}
      - {copia: "8, 10", cpu: "AMD EPYC 9V74 (avx512f visivel)", classe: avx512, pcm: "IGUAL", res_codec_dbfs: "-80,9 / -83,14", controle_codec_dbfs: "-68,63 / -68,74", veredito: "verde na prova da imagem — o teto base -80,9 da CP-011 RECONFIRMADO no head novo"}
      - {copia: "1, 3, 4, 5, 6, 7", cpu: "AMD EPYC 7763 / 9V74 (avx512f oculto)", classe: avx2, pcm: "DIVERGE (esperado)", max_delta: "duracao 0,5/2,1 ms · loudness 0,16/0,06 LU · f0 42,10/0,69 Hz · centroide 13,63/14,92 Hz", veredito: "numeros IDENTICOS nas 6 amostras (dois modelos de CPU) — o atrator avx2 e deterministico"}
    validacao_local_fase_1: >
      Redublagem dos dois filmes com o codigo novo: 19/19 .opus
      BYTE-IDENTICOS ao HEAD (git diff --exit-code -- '*.opus'), os
      audio.json com mix.pcm_f32_sha256 == etapas.json mix_pcm_f32 ==
      sha256 do arquivo f32 (jornada 6978cb72981bd942..., legitimo
      61ddf58a6e4c2916...). A prova da imagem no runner local (avx512,
      a classe ancora): PCM IDENTICO, residuo codec -inf, CONTROLE do
      codec reprova com o numero exato — ruido injetado a -68,9 dBFS
      (teto -74,9 + 6) devolve residuo -68,9 dBFS, citando o numero.
      Os controles de descritores, medidos localmente sobre a ancora:
      +0,5 dB -> loudness delta +0,50 LU exato; +20 cents -> F0 delta
      +1,93 Hz (jornada) e +4,72 Hz (legitimo); 50 ms -> duracao -50,0
      e -49,8 ms; fala trocada do mesmo guardiao -> centroide -624,14 Hz
      (jornada, aguia) e duracao -1009,90 ms (legitimo, tartaruga).
      Testes: prova por classe 35 verificacoes, equivalencia por
      descritores 13 (lock incompleto recusa; verde com tetos
      apertados; TETO_NAO_DISCRIMINA com teto folgado; vermelho real com
      +0,3 dB), dublar 33 (borda do hash no fiscal), navegador 240/240,
      validar_tudo --sem-lei conforme.
    o_achado_teto_nao_discrimina: >
      O CONTROLE POSITIVO de +20 cents mede delta de F0 mediana de
      +2,02 Hz (jornada, fala 1) e +2,87 Hz (legitimo) nos runners avx2
      reais. O teto de F0 que ACEITA a frota precisa de >= 42,10 Hz (a
      fala 22, jornada/p10/elefante: 274,11 -> 232,01 Hz entre as duas
      sinteses — p10-p90 de 132,85-478,42 Hz na PROPRIA ancora: o YIN e
      instavel na fala de timbre misto voz+trompa) ou, excluindo essa
      fala, >= 2,20 Hz (a fala 2, p02/coruja: 158,66 -> 156,46). Em
      AMBOS os casos o controle de +20 cents (2,02-2,87 Hz) NAO passaria
      do teto — e o excludente (2,20 + margem) e tao proximo do controle
      que nenhuma margem honesta separa. TETO_NAO_DISCRIMINA, com um
      dado a mais: as falas ESTAVEIS medem deltas reais de -2,20/+1,95/
      +1,72/+1,03 Hz — a divergencia avx2 move o F0 mediano por fala em
      ~10-25 cents: o "+20 cents" do plano esta NO NIVEL do ruido da
      propria frota, nao acima dele. Os OUTROS tres descritores
      discriminam: loudness frota 0,16 x controle 0,52-0,54 LU (teto
      ~0,2 pega); duracao frota 2,1 ms x controles 50,0 ms e a troca
      -1009,90/+11,80 ms (teto ~4 ms pega); centroide frota 14,92 Hz x
      troca -624,14/+184,31 Hz (teto ~20 Hz pega) — a troca de fala e
      peg por centroide E duracao mesmo sem o F0.
    execucoes: 35

  desfecho:
    entregue: >
      (1) O hash do PCM mixado f32 e CONTRATO: audio.json com
      mix.pcm_f32_sha256, redublagem byte-identica 19/19, fiscal
      cobrando o campo — nenhum .opus tocado em nenhuma hipotese. (2) O
      bloco tolerancia do voz.lock com o teto do codec MEDIDO (base
      -80,9 + margem 6 = -74,9, abaixo de -60) — e o teto
      RECONFIRMADO na frota do head novo: AMD-avx512 mediu -80,9/-83,14
      nas copias 8 e 10. (3) A PROVA DAS CLASSES AVX512 VERDE E MEDIDA
      (a decisao do dono funcionou): Intel 2/2 e AMD-avx512 2/2 com PCM
      IGUAL + codec sob teto + controle do codec reprovando com numero
      (-68,63 a -68,9); o job so fica vermelho porque a recusa do lock
      incompleto da avx2 e honesta. (4) A maquinaria de descritores
      inteira medida na frota: 6 amostras avx2 identicas, tabela
      completa na CP. (5) O passo de descritores no runner, o perfil
      guardioes-equivalencia, o pin 90ffac7 (pitch_f0/AS-DESC-008), os
      testes (35+13+33) e as docs. NAO ENTREGUE (parada): os tetos de
      descritores NAO foram registrados — o de F0 nao existe abaixo do
      ruido da frota; a prova em rodadas verdes e os merges NAO rodaram.
    parada_final: >
      TETO_NAO_DISCRIMINA ATIVA: nao existe teto de F0 mediana por fala
      que aceite a frota avx2 e pegue o controle de +20 cents (ver
      resultado_da_medicao.o_achado_teto_nao_discrimina). Os tetos de
      loudness, duracao e centroide discriminam; o de F0, nao. Pelo
      plano: PARE — os merges #12/#13/#14 NAO procedem (rito do adendo:
      CP com parada ativa nao fecha), e a decisao volta ao dono com as
      saidas abaixo. Nenhum .opus mudou; o main nao foi tocado.
    saidas_para_o_dono:
      - >
        (a) O F0 mediana sai da suite avx2: loudness + centroide +
        duracao (todos discriminam, medido) seguem como equivalencia; a
        troca de fala continua pega (centroide -624,14/+184,31 e
        duracao -1009,90/+11,80); o controle de pitch sai com ele. A
        avx2 deixa de fiscalizar altura fina — documento no PR.
      - >
        (b) O controle de pitch engorda para um nivel AUDIVEL acima do
        ruido medido (ex.: +100 cents ~ 9,7 Hz a 166 Hz): pega com teto
        excluir-a-fala-22 (~2,7 Hz), mas exige tratar a fala 22 (ver
        saida d) porque 42,10 Hz de delta instrumental a bloqueia.
      - >
        (c) F0 por VOZ (mediana concatenada por falante, como a
        carteira de voz ja faz): a fala 22 dilui na estatistica e o
        ruido por-voz cai (a medir); o +20 cents vira distinguivel.
        Muda "por fala" para "por voz" SO no F0 — decisao de desenho.
      - >
        (d) Estatistica F0 com instrumento estavel: excluir da
        estatistica as falas cujo p10-p90 na PROPRIA ancora e largo (a
        fala 22 declara 132,85-478,42 Hz — o instrumento se declara
        instavel nela ANTES de qualquer comparacao); regra declarada
        (ex.: IQR < X semitons), nao tunada por resultado. Com a fala
        22 fora, o teto ~2,7 ainda nao pega +20 cents (2,02) — esta
        saida so faz sentido COMBINADA com (b) ou (c).
      - >
        Observacao para a decisao: o achado central e que a divergencia
        avx2 move o F0 mediano por fala em ~10-25 cents REAIS (falas
        estaveis mediram -2,20/+1,95/+1,72/+1,03 Hz) — "perceptualmente
        igual" na pratica significa igual dentro de ~25 cents de altura.
        O controle de +20 cents do plano esta NO NIVEL desse ruido, nao
        acima dele: a pergunta para o dono e qual nivel de erro de pitch
        a validacao avx2 tem de enxergar.
    # (a saida unica e a lista acima — a redacao antiga de plano-cumprido
    # saiu com a parada)

  decisao_de_valor:
    contexto: >
      A CP-011 devolveu ao dono quatro saidas (runner dedicado, redub
      na familia, tolerancia doutrinaria, vermelho honesto). O dono
      escolheu um caminho QUINTO: tolerancia por ETAPA e por CLASSE —
      bytes onde a frota entrega bytes (PCM avx512), teto decodificado
      onde o codificador diverge por familia (AMD avx512), descritores
      com controle positivo onde o grafico inteiro diverge (avx2).
    o_que_acontece: >
      O dono decidiu por escrito (24/09/2026): "prova de bytes no PCM
      mixado; codec por tolerancia decodificada; AVX2 por equivalencia
      de descritores com controle positivo". A decisao foi EXECUTADA e
      MEDIDA: as duas primeiras partes verdes na frota (PCM idêntico,
      codec sob teto reconfirmado, controles reprovando); a terceira
      chocou no limite fisico do ruido — o controle de +20 cents esta
      no nivel do proprio ruido de F0 da classe avx2 (medido), e a
      regra da CP manda PARE (TETO_NAO_DISCRIMINA). A evidencia ganhou
      do plano, e o PR diz isso.
    status: "EXECUTADA E MEDIDA; PARADA TETO_NAO_DISCRIMINA devolve ao dono a pergunta que falta: qual nivel de erro de pitch a validacao avx2 tem de enxergar (saidas a-d)"

  doutrina:
    - >
      Nenhum .opus commitado muda, em nenhuma hipotese: o canônico e o
      HEAD. O audio.json ganha o hash do PCM mixado gerado da MESMA
      dublagem — regeneracao local tem de devolver .opus byte a byte
      identicos (git diff --exit-code) antes de qualquer commit.
    - >
      Verificacao separada de validacao (Andre Borges): BYTES do PCM
      VERIFICAM a sintese (o grafico que assinou o commitado);
      descritores com controle positivo VALIDAM que outra CPU entrega o
      mesmo som; o controle positivo PROVA que a validacao ainda
      enxerga mudanca real. Cada veredito leva classe, etapa comparada,
      prova aplicada e numeros.
    - >
      Tetos so medidos, num lugar so (voz.lock, bloco tolerancia),
      sempre acompanhados de controle positivo na MESMA execucao. Job
      obrigatorio, sem continue-on-error. Lock sem o teto de uma
      classe: o job recusa ("lock incompleto"), nunca verde por
      omissao.
    - >
      A nulidade NAO e audibilidade: residuo alto entre classes e
      aritmetica de rede neural sobre som perceptualmente igual — por
      isso o AVX2 e validado por descritores com controle positivo, e
      nao por null test. O teto do codec (-74,9) e o UNICO null test
      que segue como gate, porque a divergencia que ele cerca (a
      codificacao com entrada identica) e estreita e medida.

  tecnica:
    hash_no_pcm: >
      estudio_suite/dublar.py grava no audio.json (bloco mix) o
      pcm_f32_sha256 — o sha256 do MESMO arquivo f32 que a CP-011 ja
      fotografava em workspace/voz-etapas (a entrada exata do
      codificador, round-trip validada: recodificar o f32 devolve o
      .opus byte a byte). O caminho do .opus nao muda um byte: a
      gravacao do f32 e a SEGUNDA execucao do mesmo grafo que ja
      existia. O fiscal de redublagem (pipeline.fiscal_redublagem)
      cobra o campo — audio.json sem hash de PCM e divida.
    prova_avx512: >
      ci/prova_por_classe.py (dentro da imagem): classe avx512 exige
      hash do PCM identico (audio.json commitado x regenerado) E
      residuo decodificado <= teto do lock. CONTROLE do codec em toda
      execucao da classe: ruido injetado 6 dB acima do teto no .opus
      regenerado tem de REPROVAR citando o numero — o teto que nao
      pega o controle e TETO_NAO_DISCRIMINA. Sem teto no lock: recusa
      nomeada (lock incompleto).
    prova_avx2: >
      ci/equivalencia_descritores.py (no runner, com a audio-suite
      pinada por SHA): extrai cada fala dos WAVs decodificados que a
      prova publica, mede duracao (energia), loudness (LUFS), F0
      mediana (pitch_f0/AS-DESC-008) e centroide espectral
      (spectral_health), compara contra a ancora fala a fala. Tetos no
      voz.lock (bloco tolerancia, chaves descritores_*), derivados do
      maximo observado na frota AVX2 + margem declarada. CONTROLES
      POSITIVOS em toda execucao: +0,5 dB numa fala, +20 cents numa
      fala, uma fala trocada por outra do mesmo guardiao, 50 ms de
      corte — todos tem de REPROVAR nomeando o descritor; o que nao
      reprova e TETO_NAO_DISCRIMINA. Perfil proprio:
      harness/perfis/guardioes-equivalencia.yaml.
    pin_da_audio_suite: >
      O pin avanca de 296226e para 90ffac7 (main do audio-suite): o
      descritor pitch_f0 (AS-DESC-008, PR #44) nao existe no pin
      anterior. Avanca nos DOIS workflows (dublador e suite) — um pin
      so por ferramenta no repositorio.

  escopo:
    sprint_15: >
      Esta CP; estudio_suite/dublar.py (pcm_f32_sha256 no audio.json);
      estudio_suite/pipeline.py (fiscal cobra o hash);
      estudio_suite/voz.py (leitor do bloco tolerancia estendido);
      voz.lock (bloco tolerancia: teto do codec agora, tetos de
      descritores apos a medicao da frota); ci/prova_por_classe.py
