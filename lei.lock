# A lei tem um dono, e NAO e esta suite.
#
# Este arquivo ancora o commit exato de onde o texto da LGPD e a atribuicao de
# guardiao por artigo sao lidos. O CI materializa em workspace/lei/, fora do
# versionamento, e confere byte a byte contra os hashes abaixo.
#
# Por que ancorar em vez de copiar: uma copia com uma linha removida faz o
# validador dizer "nenhum achado" -- sem erro, sem aviso, indistinguivel de um
# roteiro correto. A copia derivaria em silencio, e o filme passaria a ensinar
# uma lei que ninguem escreveu.
#
# Para avancar a ancora: change-proposal (caminho protegido). Nunca em silencio,
# porque avancar a lei pode mudar o que um filme ja publicado afirma.
