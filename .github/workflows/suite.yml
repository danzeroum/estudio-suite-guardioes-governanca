name: Estúdio Suite

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Ordem por custo: o que e barato falha primeiro. O validador nao precisa de
  # navegador e leva segundos; e ele quem impede um filme de citar artigo que a
  # lei nao tem, ou de atribui-lo ao guardiao errado.
  fiscais:
    runs-on: ubuntu-latest
    env:
      # CP-007: este job PROMETE a audio-suite (instalada abaixo, isolada e
      # pinada por SHA). Promessa feita, ausencia vira VERMELHO no portao de
      # sonorizacao e na carteira de vozes -- no CI, "nao consegui medir"
      # deixa de ser estado terminal: a ferramenta faz parte do contrato
      # do job. Na maquina local, sem a variavel, o INDECISO nomeado segue
      # valendo. Tirar a audio-suite do job derruba o build -- de proposito.
      ESTUDIO_EXIGIR_AUDIO_SUITE: "1"
    steps:
      - uses: actions/checkout@v4

      # CP-008: O LOCK MANDA NO CI. Nenhuma versao de python/numpy/scipy e
      # digitada aqui -- o workflow pergunta ao voz.lock pelo mesmo parser do
      # dublar (ci/pins_do_lock.py). O passo roda com o python do runner so
      # para LER o lock; a serie impressa alimenta o setup-python abaixo.
      - name: O lock manda no CI (a serie do python)
        run: echo "PYTHON_DO_LOCK=$(python3 ci/pins_do_lock.py --python)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DO_LOCK }}

      # A lei mora num repositorio PRIVADO, e o GITHUB_TOKEN desta suite nao
      # alcanca outro repositorio. Com o segredo LEI_TOKEN (leitura em
      # danzeroum/guardioes-governanca), o gate roda inteiro. Sem ele, roda a
      # parte que nao depende da lei e DIZ que foi parcial -- porque chamar de
      # verde uma validacao que nao mediu citacao seria pior do que ficar
      # vermelho.
      - name: Trazer a lei (quando ha segredo)
        id: lei
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: danzeroum/guardioes-governanca
          path: _lei-origem
          token: ${{ secrets.LEI_TOKEN }}

      # O ffmpeg e dependencia declarada da suite (dublar, portao de
      # sonorizacao) mas NAO vem mais na imagem ubuntu-24.04 do runner. O
      # teste da ancora de amostras (CP-005) deriva wavs de verdade, como a
      # coleta real deriva -- o CI prova o mesmo caminho que a maquina local.
      - name: Instalar ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      # O motor de timbre da CP-005 e scipy/numpy puro (vocoder de canais,
      # deterministico). Dependencia declarada da suite desde a CP-005 -- e
      # o teste do motor prova no PCM, no runner, o que a maquina local prova.
      # Desde a CP-007 instala ANTES do gate unico: o fiscal de redublagem
      # entrou no gate e importa numpy via prosodia -- dependencia depois do
      # passo que a usa e dependencia quebrada. CP-008: os PINS vem do
      # voz.lock -- test_timbre/test_prosodia passam a provar determinismo
      # no ambiente ANCORADO, nao num numpy qualquer do PyPI.
      - name: Instalar numpy e scipy (pins do voz.lock)
        run: pip install --quiet $(python3 ci/pins_do_lock.py --so numpy,scipy)

      # CP-008: o ambiente MEDIDO, conferido contra a ancora, antes de
      # qualquer trabalho. Divergencia de python, numpy ou scipy derruba o
      # job. piper, espeak-ng, ffmpeg, libopus e arquitetura ficam de fora
      # desta conferencia: ESTE job nao dubla -- quem dubla e a imagem do
      # job dublador (.github/workflows/dublador.yml), onde a conferencia e
      # integral (o dublar recusa divergencia antes de sintetizar).
      - name: O ambiente medido, conferido contra o lock
        run: python3 ci/pins_do_lock.py --conferir python,numpy,scipy

      # CP-007: a audio-suite entra no CI pela porta certa -- ISOLADA (pipx,
      # venv proprio) e pinada por SHA. No ambiente da suite ela NAO pode
      # morar: exige numpy<2.2 e scipy<1.15 e REBAIXARIA o que o motor de
      # timbre usa (medido localmente: 2.4.4 -> 2.1.3 e 1.17.1 -> 1.14.1).
      # O pin por SHA e o rollback: cada estagio validado, caminho de volta
      # mantido. So o binario vai pro PATH, nunca o python do venv dela.
      - name: Instalar a audio-suite (isolada, pinada por SHA)
        run: |
          pipx install "git+https://github.com/danzeroum/audio-suite@90ffac796d7615e798b5bb7e17e48726be7fa686"
          pipx list --short
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: O gate único
        run: |
          if [ -d _lei-origem/docs/assets/data ]; then
            python3 ci/validar_tudo.py
          else
            echo "::warning::sem LEI_TOKEN — validação parcial, sem medir citações"
            python3 ci/validar_tudo.py --sem-lei
          fi

      # CP-008: os pins do lock -- o contrato de que este workflow nao
      # digita versao nenhuma, provado pelo proprio CI (o teste le o
      # suite.yml e acusa numero de python/numpy/scipy escrito a mao).
      - name: Os pins do voz.lock (CP-008)
        run: python3 tests/test_pins_do_lock.py

      - name: O módulo de automelhorias, nos dois sentidos
        run: python3 tests/test_melhorias.py

      # CP-004: a fala deriva da legenda, e o normalizador e quem garante.
      # Roda aqui porque e barato (segundos, sem navegador) -- o erro de
      # texto e o que custa menos achar, e por isso falha primeiro.
      - name: O normalizador de fala (CP-004)
        run: python3 tests/test_fala.py

      # CP-004: o fiscal de redublagem compara TEXTO, TEMPO e AMBIENTE, nao
      # bytes de audio -- por isso roda em CI, onde piper nao existe. Piper
      # ausente no runner nunca quebra o build: dublar e comando de maquina
      # local. Desde a CP-007 o fiscal roda TAMBEM no gate unico.
      - name: O fiscal de redublagem (CP-004)
        run: python3 tests/test_dublar.py

      # CP-005: som de terceiro so entra pela porta do amostras.lock. O
      # teste prova a LOGICA da ancora e do fiscal com fixtures locais
      # (file://) -- a coleta real do Freesound e evidencia de maquina
      # local, registrada no PR; o CI nao precisa de rede para fiscalizar.
      - name: A ancora e o fiscal de amostras (CP-005)
        run: python3 tests/test_amostras.py

      # CP-005: o motor de timbre e aditivo DE VERDADE -- mistura 0 devolve
      # o clipe byte a byte, e o teste prova no PCM, sem piper. Os earcons
      # sao codigo puro: duracao, taxa e ancora conferidas.
      - name: O motor de timbre e os earcons (CP-005)
        run: python3 tests/test_timbre.py

      # CP-005: a carteira de voz por falante. Com a audio-suite no runner
      # (CP-007), o teste mede de verdade e ainda prova os dois contratos:
      # INDECISO nomeado sem promessa, VERMELHO com ESTUDIO_EXIGIR_AUDIO_SUITE
      # e ferramenta ausente. Descritor nunca reprova: divida de voz e review.
      - name: A carteira de voz (CP-005)
        run: python3 tests/test_vozes.py

      # CP-006: a prosodia expressiva. Ordem da cadeia em snapshot, duracao
      # preservada, neutro byte-identico, pitch declarado-nao-aplicado.
      - name: A prosodia expressiva (CP-006)
        run: python3 tests/test_prosodia.py

      # CP-011: a prova por classe de SIMD. O classificador (flags medidas,
      # nunca fabricante), o residuo de nulidade com numero no veredito, o
      # filtro por declaracao de audio e a borda do lock incompleto — tudo
      # funcao pura ou dado sintetico, porque a sintese de verdade e da
      # imagem dubladora; aqui se prova o GATE, que e o que o CI roda.
      - name: A prova por classe de SIMD (CP-011/CP-012)
        run: python3 tests/test_prova_por_classe.py

      # CP-012: a equivalência por descritores — o INSTRUMENTO que mediu a
      # frota avx2 na CP-012 (extracao por fala, audio-suite, controles
      # positivos como funcoes puras). Sob a CP-013 nenhum teto dele é
      # gate (a avx2 saiu do gate por decisão do dono); o script segue
      # testado porque a observação da âncora (ci/observacao_ancora.py)
      # usa as MESMAS funções — o instrumento é um só. Precisa da
      # audio-suite (instalada acima, pinada) e do ffmpeg.
      - name: A equivalência por descritores (CP-012, instrumento)
        run: python3 tests/test_equivalencia_descritores.py

      # CP-013/CP-015: o AGREGADOR da prova por amostragem — veredito do
      # run com artefatos sintéticos: {1 avx512 idêntica + 11 avx2} verde;
      # zero avx512 SEM_AMOSTRA_DECISIVA (nas DUAS ondas, CP-015); onda 1
      # {8 avx2} + onda 2 {1 AVX-512 idêntica} VERDE (a segunda onda
      # automática salvou o sorteio); onda 2 divergente nomeada COM ONDA E
      # CÓPIA; onda declarada sem artefato é AMOSTRA_ILEGIVEL (nunca
      # SEM_AMOSTRA — cópia sem artefato não é sorteio); amostra ilegível
      # reprova, nunca neutra; e os contratos estruturais dos workflows
      # (onda reutilizável, roteador, onda 2 condicional, job obrigatório,
      # veredito.json publicado, matrix do lock; o registro com as ondas
      # no agregado.json).
      - name: O agregador da amostragem da frota (CP-013; ondas CP-015)
        run: python3 tests/test_agregar_prova.py

      # CP-015: O ROTEADOR da segunda onda — a decisão do dono provada:
      # o sorteio limpo sem AVX-512 acorda a segunda onda; qualquer outro
      # estado (AVX-512 presente, artefato ausente/corrompido, veredito
      # impróprio, duplicata) NÃO acorda — a segunda onda não existe para
      # mascarar cópia ilegível; a saída vai ao $GITHUB_OUTPUT e ao
      # rotear.json; a ausência estrutural é saída 2 nomeada.
      - name: O roteador da segunda onda (CP-015)
        run: python3 tests/test_rotear_segunda_onda.py

      # CP-015: O ATUALIZADOR DO REGISTRO — o braço do curador: junta os
      # agregados baixados (zips ou json) no registro versionado,
      # deduplicado por run+tentativa, ordenado, com as entradas inválidas
      # rejeitadas nomeadas e o bloco calculo regravado pelo caminho único
      # (calcular_do_registro) — o número é recalculável; --dry-run não
      # escreve; sem agregado legível é saída 2 e registro intocado.
      - name: O atualizador do registro da frota (CP-015)
        run: python3 tests/test_atualizar_registro_frota.py

      # CP-014: os RÓTULOS ÚNICOS do identidade.json — a cópia avx2 com
      # TODOS os campos de síntese em nao_aplicavel:classe_avx2; campo
      # com "ou" REPROVA (o artefato ambíguo não nasce); todo campo de
      # medição casa com medido:/falhou:/nao_aplicavel:; e o contrato
      # estrutural: o veredito/identidade nascem de ci/veredito_da_copia.py
      # e a saída cedo da avx2 não instala audio-suite.
      - name: Os rótulos únicos do identidade.json (CP-014)
        run: python3 tests/test_veredito_da_copia.py

      # CP-014/CP-015: a INDEPENDÊNCIA das cópias e o N DA JANELA,
      # recalculados do registro versionado
      # (harness/frota/execucoes-gate.json) — a taxa de SEM_AMOSTRA com os
      # ICs de 95% (Wilson e Clopper-Pearson), a correlação intra-execução
      # (homogeneidade com o n de cada execução), a JANELA MÓVEL (J do
      # lock, fração viva, N recalculado) e o FISCAL: o N do lock tem de
      # bater com o da janela, senão "N desatualizado"; a borda (menos de
      # J execuções usa todas e declara incompleta); a regra dos DOIS ICs
      # provada nos dois sentidos — o número é reproduzível, nunca
      # afirmado.
      - name: A independência das cópias e a janela (CP-014/CP-015)
        run: python3 tests/test_independencia.py

      # CP-016 (proposta): o DETERMINISMO da classe avx2 — a evidência e o
      # veredito recalculados (DETERMINISTICO_NA_CLASSE / NAO_DETERMINISTICO
      # com a tabela), as limitações declaradas (modelos/execuções), o
      # coletor por run com deduplicação — e a regra dura provada no diff:
      # esta branch não toca gate, lock nem audio.json (a decisão de virar
      # âncora é do dono).
      - name: O determinismo da classe avx2 (CP-016, proposta)
        run: python3 tests/test_determinismo_avx2.py

      # CP-004/CP-007: o sexto portao, agora MEDINDO de verdade -- a
      # audio-suite esta instalada (isolada, pinada) e o job a prometeu no
      # env. O portao publica LUFS e true peak reais por filme; FINDING
      # (saida 1) reprova; e se alguem tirar a ferramenta do job, o
      # VERMELHO da promessa quebrada derruba o build -- de proposito.
      - name: O portão de sonorização (CP-004)
        run: python3 ci/portao_sonorizacao.py

  navegador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CP-008: o mesmo lock, o mesmo caminho -- o navegador roda na serie
      # do python da ancora, lida do voz.lock (nunca digitada aqui).
      - name: O lock manda no CI (a serie do python)
        run: echo "PYTHON_DO_LOCK=$(python3 ci/pins_do_lock.py --python)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DO_LOCK }}
      - name: Instalar dependências
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium

      # CP-008: ambiente medido e conferido. Neste job so o python e da
      # ancora (numpy/scipy nao sao dependencia do navegador -- conferir o
      # que nao esta instalado seria medir o ausente e chamar de divergencia).
      - name: O ambiente medido, conferido contra o lock
        run: python3 ci/pins_do_lock.py --conferir python

      # Inclui a fumaça em file://, que é a única forma de a regra
      # "sem fetch, sem módulo ES" falhar em CI.
      - name: O motor, em Chromium
        run: python3 tests/test_navegador.py
