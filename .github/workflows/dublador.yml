name: Dublador

# CP-008: a PROVA DE PORTABILIDADE. Workflow proprio (nao um job do
# suite.yml) porque o disparo e por caminhos -- se o filtro morasse no
# suite.yml, os fiscais calariam em PR que nao toca audio, e o gate roda
# em TODO PR. Aqui so acorda quem mexe no que assina os bytes do audio:
# o lock (modelo e ambiente), as amostras (portadoras do timbre), a
# cadeia de sintese, a propria imagem, a prova ou a legenda de algum
# filme.
#
# O que ele prova: que a imagem que materializa o voz.lock reproduce
# BYTE A BYTE o audio commitado -- no runner Ubuntu, que nao e Debian 13,
# nao tem piper e seria recusado pelo dublar se tentasse dublar direto.
# Verificacao por sha256, 2 rodadas (determinismo interno + identidade
# com o commitado). Um byte que difere reprova o job e publica o diff de
# duracoes como artefato -- ONDE divergiu, nao so que divergiu.
#
# CP-009: a prova IDENTIFICA A MAQUINA. O gate ja oscilou em 3 runs com
# codigo identico porque o default de threads do onnxruntime seguia os
# nucleos da maquina: threads entrou no lock, a sessao nasce com o valor
# da ancora e e LIDA DE VOLTA. A instrumentacao (lscpu, cgroup, threads
# efetivas) publica no log E em artefato quem rodou cada veredito.
#
# CP-011: a prova e POR CLASSE DE SIMD. Com threads ancoradas e lidas em
# 8/8 execucoes, a frota bifurcou por CLASSE (7/8 AMD sem avx512f
# divergiram; 1/8 Intel com AVX-512 reproduziu): exigir bytes "em
# qualquer runner" era loteria, nao prova.
#
# CP-012: a decisao do dono (24/09/2026) definiu a prova certa POR
# ETAPA: "prova de bytes no PCM mixado; codec por tolerancia
# decodificada; AVX2 por equivalencia de descritores com controle
# positivo". Classe avx512 (Intel E AMD): o hash do PCM mixado f32 do
# audio.json regenerado contra o commitado (medido na CP-011, o PCM e
# identico entre as duas familias) + o .opus DECODIFICADO sob o teto do
# lock (base -80.9 dBFS + margem 6 = -74.9, abaixo de -60) + CONTROLE
# POSITIVO (ruido 6 dB acima do teto reprova citando o numero; teto que
# nao pega e TETO_NAO_DISCRIMINA). Classe avx2: o PCM diverge no cru e
# a nulidade nao e audibilidade — a validacao e por DESCRITORES por
# fala (loudness, F0 mediana/pitch_f0, centroide, duracao) contra os
# tetos do lock, com CONTROLES POSITIVOS (+0,5 dB, +20 cents, fala
# trocada do mesmo guardiao, 50 ms de corte) reprovando em toda
# execucao. Sem o teto da sua classe, o job RECUSA (lock incompleto) --
# nunca verde por omissao. O log e o artefato dizem SEMPRE qual prova
# rodou, com que classe e com que numeros -- verificacao (bytes no PCM)
# e validacao (teto do codec / descritores) nunca se confundem.
#
# CP-011: o FILTRO POR DECLARACAO. O job so processa filmes que DECLARAM
# audio (audio: true no proprio filme.js, lido de la -- nunca de lista de
# nomes). E so e acionado por eles: PR que so toca filme mudo (ex. um
# relatorio) nao acorda o job caro -- o planejar confere os caminhos
# mudados contra a lista dos que declaram.

on:
  workflow_dispatch:
    inputs:
      rodadas:
        description: "Cópias independentes do job (a prova de portabilidade em N)"
        default: 1
        type: number
  pull_request:
    paths:
      - 'voz.lock'
      - 'amostras.lock'
      - 'estudio_suite/dublar.py'
      - 'estudio_suite/voz.py'
      - 'estudio_suite/fala.py'
      - 'estudio_suite/prosodia.py'
      - 'estudio_suite/timbre.py'
      - 'estudio_suite/comum.py'
      - 'ferramentas/dublador/**'
      - 'ci/pins_do_lock.py'
      - 'ci/prova_por_classe.py'
      - '.github/workflows/dublador.yml'
      - 'filmes/*/*.filme.js'

jobs:
  # A matrix de copias nasce AQUI: em PR nao ha input (1 copia); em
  # workflow_dispatch, `rodadas` copias. fail-fast desligado de proposito:
  # numa frota heterogenea, cancelar as outras copias na primeira falha
  # destruiria exatamente a evidencia que o diagnostico precisa (quem
  # passou x quem falhou). O job segue OBRIGATORIO: sem continue-on-error
  # -- copia reprovada reprova o run inteiro.
  #
  # CP-011: aqui tambem nasce o FILTRO POR DECLARACAO -- a lista de
  # filmes que declaram audio (do proprio filme.js) e a decisao de rodar
  # (PR de filme mudo nao aciona o job caro).
  planejar:
    runs-on: ubuntu-latest
    outputs:
      copias: ${{ steps.copias.outputs.lista }}
      filmes: ${{ steps.filtro.outputs.filmes }}
      rodar: ${{ steps.filtro.outputs.rodar }}
      motivo: ${{ steps.filtro.outputs.motivo }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # o diff de caminhos do PR precisa da base

      - id: copias
        env:
          RODADAS: ${{ inputs.rodadas }}
        shell: bash
        run: |
          N="${RODADAS:-1}"
          case "$N" in ''|*[!0-9]*) N=1;; esac
          [ "$N" -lt 1 ] && N=1
          [ "$N" -gt 12 ] && N=12
          lista="["
          i=1
          while [ "$i" -le "$N" ]; do
            [ "$i" -gt 1 ] && lista="$lista,"
            lista="$lista\"copia-$i\""
            i=$((i+1))
          done
          echo "lista=$lista]" >> "$GITHUB_OUTPUT"
          echo "copias: $lista] (rodadas pedidas: ${RODADAS:-1, padrao de PR})"

      # CP-011: quem declara audio, lido do PROPRIO filme (nunca lista de
      # nomes); e se este PR acorda o job caro. Acordam o job: mudanca em
      # caminho que assina bytes (lock, amostras, cadeia, imagem, prova) OU
      # no filme.js de filme que DECLARA audio. Um filme mudo nao aciona.
      - id: filtro
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENTO: ${{ github.event_name }}
        shell: bash
        run: |
          python3 - <<'EOF' | tee /tmp/planejar.log
          import os, subprocess, sys
          sys.path.insert(0, ".")
          from estudio_suite.comum import dados_do_filme, filmes_existentes

          com_audio = []
          for fid in filmes_existentes():
              try:
                  if dados_do_filme(fid).get("audio"):
                      com_audio.append(fid)
              except Exception:
                  pass          # ilegivel ja foi apontado no stderr da leitura
          print(f"filmes={' '.join(com_audio)}")

          if os.environ.get("EVENTO") != "pull_request":
              print("rodar=true")
              print("motivo=dispatch manual — prova em: " + (", ".join(com_audio) or "nenhum filme declara audio"))
          else:
              base, head = os.environ["BASE_SHA"], os.environ["HEAD_SHA"]
              muda = subprocess.run(
                  ["git", "diff", "--name-only", f"{base}...{head}"],
                  capture_output=True, text=True).stdout.split()
              assina = any(
                  p in ("voz.lock", "amostras.lock",
                        "ci/pins_do_lock.py", "ci/prova_por_classe.py",
                        ".github/workflows/dublador.yml")
                  or p.startswith(("estudio_suite/", "ferramentas/dublador/"))
                  for p in muda)
              com_audio_tocado = False
              for p in muda:
                  partes = p.split("/")
                  if (len(partes) == 3 and partes[0] == "filmes"
                          and partes[2].endswith(".filme.js")):
                      try:
                          if dados_do_filme(partes[1]).get("audio"):
                              com_audio_tocado = True
                      except Exception:
                          pass
              rodar = assina or com_audio_tocado
              print(f"rodar={'true' if rodar else 'false'}")
              motivo = []
              if assina:
                  motivo.append("caminho que assina bytes de audio mudou")
              if com_audio_tocado:
                  motivo.append("filme.js de filme que declara audio mudou")
              if not motivo:
                  motivo.append("PR sem mudanca que assina audio e sem filme "
                                "com audio — filme mudo NAO aciona o job (CP-011)")
              print("motivo=" + "; ".join(motivo))
          EOF
          while IFS= read -r linha; do
            case "$linha" in
              filmes=*)  echo "${linha}"   >> "$GITHUB_OUTPUT" ;;
              rodar=*)   echo "${linha}"   >> "$GITHUB_OUTPUT" ;;
              motivo=*)  echo "${linha}"   >> "$GITHUB_OUTPUT" ;;
            esac
          done < <(grep -E '^(filmes|rodar|motivo)=' /tmp/planejar.log)
          echo "== filtro (CP-011): $(grep '^motivo=' /tmp/planejar.log | cut -d= -f2-)"

  dublador:
    needs: planejar
    if: needs.planejar.outputs.rodar == 'true'
    strategy:
      fail-fast: false
      matrix:
        copia: ${{ fromJSON(needs.planejar.outputs.copias) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # O cache e chaveado pelo sha256 do lock QUE O DECLARA: voz.lock e a
      # identidade do modelo (hash novo, modelo novo); amostras.lock e a
      # identidade das portadoras. Cache sem chave de lock serviria modelo
      # errado rapido -- o oposto do que o lock existe para garantir.
      - name: As chaves de cache sao os sha256 dos locks
        run: |
          echo "VOZ_LOCK_SHA=$(sha256sum voz.lock | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "AMOSTRAS_LOCK_SHA=$(sha256sum amostras.lock | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: O cache do modelo de voz (workspace/voz)
        uses: actions/cache@v4
        with:
          path: workspace/voz
          key: voz-modelo-${{ env.VOZ_LOCK_SHA }}

      - name: O cache das portadoras e earcons (workspace/amostras)
        uses: actions/cache@v4
        with:
          path: workspace/amostras
          key: amostras-${{ env.AMOSTRAS_LOCK_SHA }}

      # CP-009: a IDENTIDADE DA MAQUINA, medida e publicada ANTES de
      # dublar — no log e num artefato JSON. lscpu --json: o parser e
      # deterministico, o grep em campo traduzido nao seria.
      # CP-011: a classe do runner nasce AQUI, pelo MESMO classificador do
      # dublar (estudio_suite/voz.py — um lugar so), lendo as MESMAS flags;
      # e as FLAGS COMPLETAS vão para o artefato: a chave da classe pode
      # precisar de mais uma flag (CLASSE_MAL_DEFINIDA — um 9V45 com avx512f
      # divergiu), e descobrir QUAL exige o diff das flags de quem passa x
      # quem diverge. Flags fora do artefato seria descobrimento impossível.
      - name: A identidade da máquina (lscpu, classe, ancora, teto, flags)
        shell: bash
        run: |
          lscpu --json > /tmp/lscpu.json
          mkdir -p /tmp/identidade
          python3 - <<'EOF' | tee /tmp/identidade-maquina.env
          import json
          d = json.load(open('/tmp/lscpu.json'))
          campos = {e['field'].rstrip(':').strip(): (e['data'] or '').strip()
                    for e in d['lscpu']}
          flags = set(campos.get('Flags', '').split())
          sockets = int(campos.get('Socket(s)', '0') or 0)
          por_socket = int(campos.get('Core(s) per socket', '0') or 0)
          fisicos = sockets * por_socket
          linhas = [
              f"CPU_MODELO={campos.get('Model name', 'ilegivel')}",
              f"SOCKETS={sockets}",
              f"NUCLEOS_POR_SOCKET={por_socket}",
              f"NUCLEOS_FISICOS={fisicos}",
              f"THREADS_POR_NUCLEO={campos.get('Thread(s) per core', 'ilegivel')}",
              f"AVX2={int('avx2' in flags)}",
              f"AVX512F={int('avx512f' in flags)}",
              f"AMX_TILE={int('amx_tile' in flags)}",
              f"FLAGS_SIMD={' '.join(sorted(f for f in flags if f.startswith(('avx', 'amx', 'sse', 'fma', 'mmx', 'xop', 'gfni', 'vaes', 'vpclmul', 'sha'))))}",
          ]
          print('\n'.join(linhas))
          # as flags COMPLETAS vão para o artefato (a descoberta da chave
          # da classe é o diff destas listas entre quem passa e quem falha)
          open('/tmp/identidade/flags-completas.txt', 'w').write(
              campos.get('Model name', '?') + '\n' + ' '.join(sorted(flags)) + '\n')
          EOF
          cat /tmp/identidade-maquina.env >> "$GITHUB_ENV"
          NPROC=$(nproc)
          CGROUP_CPU=$(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo "ilegivel")
          echo "NPROC=$NPROC" | tee -a "$GITHUB_ENV"
          echo "CGROUP_CPU=$CGROUP_CPU" | tee -a "$GITHUB_ENV"
          echo "COPIA=${{ matrix.copia }}" >> "$GITHUB_ENV"
          echo "RUN_ID=${{ github.run_id }}" >> "$GITHUB_ENV"
          echo "ATTEMPT=${{ github.run_attempt }}" >> "$GITHUB_ENV"
          # CP-011: a classe do runner, PELO CLASSIFICADOR UNICO — o mesmo
          # codigo que o dublar usa dentro da imagem e os testes testam.
          CLASSE_DO_RUNNER=$(python3 -c "
          import sys; sys.path.insert(0, '.')
          from estudio_suite import voz
          print(voz.classe_simd_medida())")
          echo "CLASSE_DO_RUNNER=$CLASSE_DO_RUNNER" | tee -a "$GITHUB_ENV"
          CLASSE_ANCORA=$(python3 ci/pins_do_lock.py --classe-simd)
          echo "CLASSE_ANCORA=$CLASSE_ANCORA" | tee -a "$GITHUB_ENV"
          TETO_RESIDUO=$(python3 ci/pins_do_lock.py --teto-residuo 2>/dev/null || true)
          echo "TETO_RESIDUO=${TETO_RESIDUO:-}" >> "$GITHUB_ENV"
          TETOS_DESCRITORES=$(python3 ci/pins_do_lock.py --tetos-descritores 2>/dev/null || true)
          echo "TETOS_DESCRITORES=${TETOS_DESCRITORES:-}" >> "$GITHUB_ENV"
          echo "== identidade do runner (CP-009/CP-011/CP-012):"
          cat /tmp/identidade-maquina.env | grep -v '^FLAGS_SIMD='
          echo "  nproc:         $NPROC"
          echo "  cgroup cpu:    $CGROUP_CPU"
          echo "  classe SIMD:   $CLASSE_DO_RUNNER (ancora: $CLASSE_ANCORA)"
          echo "  teto do codec: ${TETO_RESIDUO:-NAO REGISTRADO — lock INCOMPLETO para a classe avx512}"
          echo "  tetos descritores: ${TETOS_DESCRITORES:-NAO REGISTRADOS — lock INCOMPLETO para a classe avx2 (fase de medicao: numeros publicados, veredito recusado)}"
          echo "  flags SIMD:    $(grep '^FLAGS_SIMD=' /tmp/identidade-maquina.env | cut -d= -f2- | tr ' ' '\n' | wc -l) flags (completas no artefato)"

      # buildx com cache de camadas do GitHub Actions: a base por digest e
      # os pins do lock mudam raramente; o build efetivo costuma ser so
      # resolver metadata. O rollback e o proprio digest + os pins do lock.
      # CP-009: o --build-arg de threads vem do voz.lock (pins_do_lock.py
      # --threads) — o ENV OMP/OPENBLAS/MKL da imagem nasce dele, e o
      # dublar confere o ENV na entrada. Numero digitado em segundo lugar
      # seria defeito; aqui ha so uma fonte.
      - name: O builder com cache de camadas
        run: docker buildx create --name dublador --driver docker-container --use

      - name: A imagem que materializa o lock
        run: |
          THREADS_DO_LOCK=$(python3 ci/pins_do_lock.py --threads)
          echo "== threads da ancora (voz.lock): $THREADS_DO_LOCK"
          echo "THREADS_ANCORA=$THREADS_DO_LOCK" >> "$GITHUB_ENV"
          docker buildx build \
            --platform linux/amd64 \
            --build-arg THREADS_DO_LOCK="$THREADS_DO_LOCK" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --load \
            -t estudio-dublador:voz-lock \
            -f ferramentas/dublador/Dockerfile .

      # CP-009: as THREADS EFETIVAS DA SESSAO, lidas de DENTRO da imagem,
      # pelo MESMO caminho do dublar (ancora -> ENV -> materializar ->
      # sessao -> get_session_options). E a prova de que a ancora chega
      # na sessao ANTES de qualquer sintese — e o valor que vai para o
      # audio.json e para o artefato de identidade.
      - name: As threads efetivas da sessão (de dentro da imagem)
        env:
          ESTUDIO_VOZ_CACHE: ${{ github.workspace }}/workspace/voz
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD":/app -v "$ESTUDIO_VOZ_CACHE":/app/workspace/voz -w /app \
            estudio-dublador:voz-lock python3 -c '
          import sys
          sys.path.insert(0, ".")
          from estudio_suite import voz
          from estudio_suite.dublar import _voz_do_lock, _conferir_threads_da_sessao
          a = voz.ancora()
          threads = voz.conferir_threads(a["ambiente"])
          base = voz.materializar()
          voice = _voz_do_lock(base / (a["nome"] + ".onnx"), threads)
          efetivo = _conferir_threads_da_sessao(voice, threads)
          print("THREADS_EFETIVAS=%d" % efetivo)
          print("OMP_NUM_THREADS=%s" % __import__("os").environ.get("OMP_NUM_THREADS"))
          ' | tee /tmp/probe-threads.txt
          grep "THREADS_EFETIVAS=" /tmp/probe-threads.txt >> "$GITHUB_ENV"
          grep "OMP_NUM_THREADS=" /tmp/probe-threads.txt >> "$GITHUB_ENV" || true

      # O compromisso: os .opus commitados. As dublagens regeneram POR
      # CIMA (o dublar escreve no repositorio montado) -- por isso a copia
      # (e os sha256, e desde a CP-011 tambem o audio.json, referencia das
      # DURACOES POR FALA) acontece ANTES da primeira rodada.
      - name: Os sha256 do que esta commitado
        shell: bash
        run: |
          mkdir -p /tmp/commitado
          find filmes -path '*/audio/*.opus' | sort | while read -r f; do
            mkdir -p "/tmp/commitado/$(dirname "$f")"
            cp "$f" "/tmp/commitado/$f"
            sha256sum "$f"
          done | tee /tmp/commitado.sha256
          find filmes -path '*/audio/audio.json' | sort | while read -r f; do
            cp "$f" "/tmp/commitado/$f"
          done

      # Duas rodadas: a 1 prova determinismo da imagem, a 2 prova que a
      # determinacao e estavel. CP-011: os filmes vem do PLANEJAR — os
      # que DECLARAM audio, lidos do proprio filme.js — nunca de nomes
      # escritos aqui; e cada rodada arquiva o hash POR ETAPA que o
      # dublar publica em workspace/voz-etapas/ (diagnostico de ONDE a
      # divergencia nasce, nao contrato do repositorio).
      - name: Dublar quem declara audio (rodada 1)
        env:
          ESTUDIO_VOZ_CACHE: ${{ github.workspace }}/workspace/voz
        run: |
          for fid in ${{ needs.planejar.outputs.filmes }}; do
            ferramentas/dublador/dublar.sh "$fid"
          done
          find filmes -path '*/audio/*.opus' | sort | xargs sha256sum > /tmp/rodada1.sha256
          mkdir -p /tmp/etapas-rodada1
          cp workspace/voz-etapas/*.etapas.json /tmp/etapas-rodada1/ 2>/dev/null || true

      - name: Dublar quem declara audio (rodada 2)
        env:
          ESTUDIO_VOZ_CACHE: ${{ github.workspace }}/workspace/voz
        run: |
          for fid in ${{ needs.planejar.outputs.filmes }}; do
            ferramentas/dublador/dublar.sh "$fid"
          done
          find filmes -path '*/audio/*.opus' | sort | xargs sha256sum > /tmp/rodada2.sha256
          mkdir -p /tmp/etapas-rodada2
          cp workspace/voz-etapas/*.etapas.json /tmp/etapas-rodada2/ 2>/dev/null || true

      # O determinismo interno vale para TODA classe (a mesma maquina tem
      # de devolver os mesmos bytes duas vezes — o que a imagem garante).
      # A comparacao contra o commitado mudou de casa: agora e a PROVA POR
      # CLASSE (abaixo) que decide se exige bytes ou tolerancia.
      - name: O determinismo interno da imagem (rodada 1 == rodada 2)
        run: |
          echo "== rodada 1 == rodada 2 (o determinismo da imagem)"
          diff -u /tmp/rodada1.sha256 /tmp/rodada2.sha256
          echo "== hash por etapa: rodada 1 == rodada 2 (diagnostico)"
          if diff -rq /tmp/etapas-rodada1 /tmp/etapas-rodada2; then
            echo "   etapas identicas entre rodadas (pcm_cru/pos_prosodia/pos_timbre/mix/opus)"
          else
            echo "   ATENCAO: etapas divergem entre rodadas com .opus iguais — diagnostico"
          fi

      # CP-012: A PROVA POR CLASSE. Roda DENTRO da imagem (numpy, ffmpeg,
      # repositorio montado, o MESMO classificador do dublar): na classe
      # avx512, BYTES NO PCM MIXADO (o hash f32 do audio.json) + codec
      # decodificado sob teto + o CONTROLE do teto (ruido 6 dB acima
      # reprova citando o numero; teto que nao pega e
      # TETO_NAO_DISCRIMINA); na classe avx2, duracoes do manifesto aqui
      # e a EQUIVALENCIA POR DESCRITORES no runner (passo seguinte). Sem
      # o teto da classe, RECUSA nomeada (lock incompleto) — os numeros
      # desta execucao sao medidos e publicados ANTES da recusa: e deles
      # que o teto nasce. Os residuos nos DOIS pontos seguem publicados
      # como diagnostico.
      - name: A prova por classe (dentro da imagem)
        shell: bash
        run: |
          mkdir -p /tmp/prova
          docker run --rm --platform linux/amd64 \
            -v "$PWD":/app -v /tmp/commitado:/commitado -v /tmp/prova:/prova -w /app \
            estudio-dublador:voz-lock \
            python3 ci/prova_por_classe.py --commitado /commitado --saida /prova \
            | tee /tmp/prova/prova.log

      # CP-012: a EQUIVALENCIA POR DESCRITORES — no RUNNER, com a
      # audio-suite (CLI externa, isolada por pipx, PINADA POR SHA —
      # avancada para 90ffac7 porque o pitch_f0/AS-DESC-08 nao existe no
      # pin anterior) e numpy (pin do voz.lock, uma fonte so). Roda em
      # TODA classe: na avx2 e o veredito da equivalencia (deltas por
      # fala contra os tetos do lock); na avx512 os deltas sao ~0 e o
      # passo vale pelos CONTROLES POSITIVOS — que provam, em toda
      # execucao, que os tetos ainda enxergam mudanca real (+0,5 dB,
      # +20 cents, fala trocada do mesmo guardiao, 50 ms de corte). Sem
      # os tetos no lock, o passo MEDE e publica e RECUSA (lock
      # incompleto) — nunca verde por omissao. O teto do codec tem o
      # proprio controle DENTRO da prova da imagem.
      - name: A equivalência por descritores (no runner, com controles)
        shell: bash
        run: |
          pipx install "git+https://github.com/danzeroum/audio-suite@90ffac796d7615e798b5bb7e17e48726be7fa686"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          python3 -m pip install --user --quiet             $(python3 ci/pins_do_lock.py --so numpy) 2>/dev/null
          set -o pipefail
          python3 ci/equivalencia_descritores.py             --prova /tmp/prova --commitado /tmp/commitado             | tee /tmp/prova/descritores.log

      # CP-009/CP-011: o artefato de identidade — SEMPRE (verde ou
      # vermelho). Verde sem identidade seria sorte sem prova; vermelho
      # sem identidade seria diagnostico perdido (André Borges: cada
      # veredito carrega maquina, classe, prova aplicada e numeros).
      # Carrega tambem o hash POR ETAPA de cada rodada e o prova.json
      # com os residuos medidos nos dois pontos.
      - name: O artefato de identidade (run, CPU, classe, prova, números)
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/identidade
          THREADS_GRAVADAS=$(python3 -c "
          import json, glob
          alvo = sorted(glob.glob('filmes/*/audio/audio.json'))
          print(json.load(open(alvo[0]))['ambiente'].get('threads', 'ausente') if alvo else 'sem filme')" 2>/dev/null || echo "ilegivel")
          if [ -f /tmp/prova/prova.json ]; then
            VEREDITO_PROVA=$(python3 -c "
          import json
          print(json.load(open('/tmp/prova/prova.json')).get('veredito', '?'))")
          else
            VEREDITO_PROVA="NAO RODOU"
          fi
          if [ -f /tmp/prova/descritores.json ]; then
            VEREDITO_DESCRITORES=$(python3 -c "
          import json
          print(json.load(open('/tmp/prova/descritores.json')).get('veredito', '?'))")
          else
            VEREDITO_DESCRITORES="NAO RODOU"
          fi
          if [ -f /tmp/rodada1.sha256 ] && [ -f /tmp/rodada2.sha256 ] \
             && diff -q /tmp/rodada1.sha256 /tmp/rodada2.sha256 >/dev/null 2>&1; then
            DETERMINISMO="estavel"
          else
            DETERMINISMO="DIVERGENTE"
          fi
          export THREADS_GRAVADAS VEREDITO_PROVA VEREDITO_DESCRITORES DETERMINISMO
          python3 - <<'EOF' > /tmp/identidade/identidade.json
          import json, os
          dados = {
            "run_id": os.environ.get("RUN_ID"),
            "run_attempt": os.environ.get("ATTEMPT"),
            "copia": os.environ.get("COPIA"),
            "cpu": {
              "modelo": os.environ.get("CPU_MODELO"),
              "sockets": os.environ.get("SOCKETS"),
              "nucleos_fisicos": os.environ.get("NUCLEOS_FISICOS"),
              "threads_por_nucleo": os.environ.get("THREADS_POR_NUCLEO"),
              "avx2": bool(int(os.environ.get("AVX2", "0"))),
              "avx512f": bool(int(os.environ.get("AVX512F", "0"))),
              "amx_tile": bool(int(os.environ.get("AMX_TILE", "0"))),
              "nproc": os.environ.get("NPROC"),
              "cgroup_cpu_max": os.environ.get("CGROUP_CPU"),
            },
            "threads": {
              "ancora_voz_lock": os.environ.get("THREADS_ANCORA", "nao lida"),
              "efetivas_da_sessao": os.environ.get("THREADS_EFETIVAS", "nao medida"),
              "gravadas_no_audio_json": os.environ.get("THREADS_GRAVADAS", "nao lidas"),
              "omp_da_imagem": os.environ.get("OMP_NUM_THREADS", "nao medido"),
            },
            "classe_simd": {
              "do_runner": os.environ.get("CLASSE_DO_RUNNER", "nao medida"),
              "da_ancora": os.environ.get("CLASSE_ANCORA", "nao lida"),
              "teto_residuo_dbfs": os.environ.get("TETO_RESIDUO") or "NAO REGISTRADO",
            },
            "prova": {
              "determinismo_interno": os.environ.get("DETERMINISMO"),
              "veredito_da_prova_por_classe": os.environ.get("VEREDITO_PROVA"),
              "veredito_da_equivalencia_descritores": os.environ.get(
                  "VEREDITO_DESCRITORES"),
              "tetos_descritores": os.environ.get("TETOS_DESCRITORES") or
                  "NAO REGISTRADOS (lock incompleto p/ avx2)",
            },
          }
          print(json.dumps(dados, indent=1, ensure_ascii=False))
          EOF
          cat /tmp/identidade/identidade.json
          cp -r /tmp/etapas-rodada1 /tmp/identidade/ 2>/dev/null || true
          cp -r /tmp/etapas-rodada2 /tmp/identidade/ 2>/dev/null || true
          cp /tmp/prova/prova.json /tmp/prova/prova.log              /tmp/prova/descritores.json /tmp/prova/descritores.log              /tmp/identidade/ 2>/dev/null || true
          echo "== hash por etapa (rodada 2):"
          cat /tmp/etapas-rodada2/*.etapas.json 2>/dev/null | head -40 || echo "  (sem etapas)"

      # Onde divergiu, quando diverge: duracoes do commitado contra as
      # regeneradas, medidas pelo ffprobe DA PROPRIA IMAGEM (a ancora e
      # ele tambem) -- e publicadas como artefato para o diagnostico,
      # JUNTO com a identidade da maquina que divergiu.
      - name: O diff de duracoes (diagnostico da falha)
        if: failure()
        shell: bash
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD":/app -v /tmp/commitado:/commitado -w /app \
            estudio-dublador:voz-lock sh -c '
              for f in $(find filmes -path "*/audio/*.opus" | sort); do
                a=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "/commitado/$f" 2>/dev/null || echo "?")
                b=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f" 2>/dev/null || echo "?")
                printf "%s  commitado=%s  regenerado=%s\n" "$f" "$a" "$b"
              done' | tee /tmp/identidade/duracoes.diff

      - name: Publicar o diff de duracoes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diff-de-duracoes-${{ matrix.copia }}
          path: /tmp/identidade/

      - name: Publicar a identidade (verde tambem)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identidade-${{ matrix.copia }}-run${{ github.run_id }}
          path: /tmp/identidade/
