name: Dublador

# CP-008: a PROVA DE PORTABILIDADE. Workflow proprio (nao um job do
# suite.yml) porque o disparo e por caminhos -- se o filtro morasse no
# suite.yml, os fiscais calariam em PR que nao toca audio, e o gate roda
# em TODO PR. Aqui so acorda quem mexe no que assina os bytes do audio:
# o lock (modelo e ambiente), as amostras (portadoras do timbre), a
# cadeia de sintese, a propria imagem, a prova ou a legenda de algum
# filme.
#
# O que ele prova: que a imagem que materializa o voz.lock reproduce
# BYTE A BYTE o audio commitado -- no runner Ubuntu, que nao e Debian 13,
# nao tem piper e seria recusado pelo dublar se tentasse dublar direto.
# Verificacao por sha256, 2 rodadas (determinismo interno + identidade
# com o commitado). Um byte que difere reprova o job e publica o diff de
# duracoes como artefato -- ONDE divergiu, nao so que divergiu.
#
# CP-009: a prova IDENTIFICA A MAQUINA. O gate ja oscilou em 3 runs com
# codigo identico porque o default de threads do onnxruntime seguia os
# nucleos da maquina: threads entrou no lock, a sessao nasce com o valor
# da ancora e e LIDA DE VOLTA. A instrumentacao (lscpu, cgroup, threads
# efetivas) publica no log E em artefato quem rodou cada veredito.
#
# CP-011: a prova e POR CLASSE DE SIMD. Com threads ancoradas e lidas em
# 8/8 execucoes, a frota bifurcou por CLASSE (7/8 AMD sem avx512f
# divergiram; 1/8 Intel com AVX-512 reproduziu): exigir bytes "em
# qualquer runner" era loteria, nao prova.
#
# CP-012: a decisao do dono (24/09/2026) definiu a prova certa POR
# ETAPA: "prova de bytes no PCM mixado; codec por tolerancia
# decodificada; AVX2 por equivalencia de descritores com controle
# positivo". Classe avx512 (Intel E AMD): o hash do PCM mixado f32 do
# audio.json regenerado contra o commitado (medido na CP-011, o PCM e
# identico entre as duas familias) + o .opus DECODIFICADO sob o teto do
# lock (base -80.9 dBFS + margem 6 = -74.9, abaixo de -60) + CONTROLE
# POSITIVO (ruido 6 dB acima do teto reprova citando o numero; teto que
# nao pega e TETO_NAO_DISCRIMINA).
#
# CP-013: a decisao do dono (24/09/2026, saida (e)) — "a prova
# decisiva e bytes do PCM mixado em copia AVX-512 visivel; AVX2 e
# observacao; sem amostra decisiva e vermelho nomeado" — resolve a
# TETO_NAO_DISCRIMINA da CP-012 SEM ajustar instrumento ou controle:
# nenhum teto de descritor entra no lock como gate. O job vira
# AMOSTRAGEM DA FROTA: a matrix de copias nasce do N do LOCK (bloco
# frota — recalculado da JANELA MOVEL do registro desde a CP-015, nunca
# digitado aqui). Cada copia CLASSIFICA primeiro: avx512 -> build e a
# prova completa da CP-012; avx2 -> sai CEDO (CP-014: sem build, sem
# gate, sem audio-suite, sem medir a âncora) e termina NEUTRA. O job
# AGREGADOR decide o run inteiro sobre TODAS AS ONDAS.
#
# FROTA COMPROVADA (CP-013, 24-25/09/2026): 12 cópias AVX-512 IDENTICAS
# nos heads finais (Intel de duas gerações + AMD-avx512), zero
# divergentes, controle do codec reprovando em todas; 33 cópias avx2 em
# observação; SEM_AMOSTRA_DECISIVA ocorreu 2x — vermelho nomeado, e o
# RERUN devolveu o verde nas duas: o desenho funcionou como especificado
# (e as duas ocorrências entraram no registro, com a fonte declarada).
#
# CP-014 (25/09/2026, diretiva do dono): a cópia avx2 do gate sai
# cedo SEM instalar audio-suite e SEM medir a âncora commitada — "medir
# o mesmo arquivo em toda cópia não traz informação". A observação de
# verdade — regenerado x âncora, fala a fala, com build — é o DISPATCH
# MANUAL observar_avx2 (.github/workflows/observar-avx2.yml), rotulado
# "observação, sem gate". O veredito e a identidade da cópia nascem de
# ci/veredito_da_copia.py com RÓTULOS ÚNICOS: medido:<valor>,
# falhou:<motivo>, nao_aplicavel:<motivo> — texto com "ou" reprova a
# geração. O agregador publica no agregado.json a entrada de registro
# de cada execução para o registro versionado crescer por PR de
# manutenção — commit automático no main, jamais.
#
# CP-015 (25/09/2026, decisão do dono): "N pela fração da janela móvel
# da frota; segunda onda automática quando a primeira não tiver
# AVX-512; rerun humano deixa de ser o caminho de volta." A estrutura
# do workflow vira DUAS ONDAS e um ROTEADOR:
#
#   planejar        o N do lock (recalculado da janela), os filmes que
#                   declaram audio, e se este PR acorda o job caro
#   dublador-onda1  a onda 1 — matrix de N cópias no workflow
#                   REUTILIZÁVEL dublador-onda.yml (o corpo da cópia é
#                   um só para as duas ondas)
#   rotear          olha a onda 1 (ci/rotear_segunda_onda.py): a segunda
#                   onda acorda SE E SÓ SE todas as cópias da onda 1 são
#                   avx2 (zero AVX-512 no sorteio) e tudo é legível —
#                   ilegível NÃO vira outra sorte, o agregador nomeia
#   dublador-onda2  a onda 2 — a MESMA matrix N, os MESMOS passos, o
#                   número da onda diferente no veredito e no artefato
#   agregar         o veredito do RUN sobre TODAS as ondas declaradas:
#                   verde com >=1 AVX-512 idêntica e zero divergentes;
#                   DIVERGENCIA_AVX512 nomeia ONDA e cópia;
#                   SEM_AMOSTRA_DECISIVA só nasce após DUAS ondas vazias
#                   (P(duas) = 0,0315% com N=13 e a fração da janela) e
#                   continua vermelho nomeado — mas o caminho de volta
#                   automático JÁ RODOU dentro do run; ilegível reprova,
#                   nunca neutra.
#
# O N não é digitado aqui nem no dublador-onda.yml: o planejar pergunta
# ao lock (ci/pins_do_lock.py --amostragem-n), o lock é recalculado da
# janela do registro pelo teste, e a mudança de N é PR de manutenção —
# nunca commit automático.
#
# CP-011: o FILTRO POR DECLARACAO. O job so processa filmes que DECLARAM
# audio (audio: true no proprio filme.js, lido de la -- nunca de lista de
# nomes). E so e acionado por eles: PR que so toca filme mudo (ex. um
# relatorio) nao acorda o job caro -- o planejar confere os caminhos
# mudados contra a lista dos que declaram.

on:
  # CP-013/CP-015: sem input de rodadas ou de N — o N das cópias mora no
  # voz.lock (bloco frota, recalculado da janela do registro), lido pelo
  # planejar. Um input que sobrescrevesse o N seria a segunda morada do
  # numero; matrix fora do tamanho do lock é recusada pelo agregador
  # (--conferir-n), nunca verde por omissão.
  workflow_dispatch:
  pull_request:
    paths:
      - 'voz.lock'
      - 'amostras.lock'
      - 'estudio_suite/dublar.py'
      - 'estudio_suite/voz.py'
      - 'estudio_suite/fala.py'
      - 'estudio_suite/prosodia.py'
      - 'estudio_suite/timbre.py'
      - 'estudio_suite/comum.py'
      - 'ferramentas/dublador/**'
      - 'ci/pins_do_lock.py'
      - 'ci/prova_por_classe.py'
      - 'ci/agregar_prova.py'
      - 'ci/veredito_da_copia.py'
      - 'ci/observacao_ancora.py'
      - 'ci/observar_avx2.py'
      - 'ci/independencia.py'
      - 'ci/rotear_segunda_onda.py'
      - 'ci/atualizar_registro_frota.py'
      - 'harness/frota/execucoes.json'
      - 'harness/frota/execucoes-gate.json'
      - '.github/workflows/dublador.yml'
      - '.github/workflows/dublador-onda.yml'
      - '.github/workflows/observar-avx2.yml'
      - 'filmes/*/*.filme.js'

jobs:
  # A matrix de copias nasce AQUI — e do LOCK (CP-013; CP-015: o N é o da
  # janela): o N é derivado da fração das últimas J execuções do registro
  # do gate (bloco frota do voz.lock) e lido por ci/pins_do_lock.py
  # --amostragem-n; lock sem o bloco reprova o job com causa nomeada
  # (lock incompleto), nunca uma matrix chutada. fail-fast desligado de
  # proposito: numa frota heterogenea, cancelar as outras copias na
  # primeira falha destruiria exatamente a evidencia que o diagnostico
  # precisa (quem passou x quem falhou). O veredito do run NAO e de copia
  # nenhuma: e do AGREGADOR, o job final. O job segue OBRIGATORIO: sem
  # continue-on-error.
  #
  # CP-011: aqui tambem nasce o FILTRO POR DECLARACAO -- a lista de
  # filmes que declaram audio (do proprio filme.js) e a decisao de rodar
  # (PR de filme mudo nao aciona o job caro).
  planejar:
    runs-on: ubuntu-latest
    outputs:
      copias: ${{ steps.copias.outputs.lista }}
      filmes: ${{ steps.filtro.outputs.filmes }}
      rodar: ${{ steps.filtro.outputs.rodar }}
      motivo: ${{ steps.filtro.outputs.motivo }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # o diff de caminhos do PR precisa da base

      - id: copias
        shell: bash
        run: |
          # CP-013/CP-015: o N vem do lock (bloco frota — da fração da
          # JANELA MÓVEL do registro; o teste recalcula e fiscaliza
          # "N desatualizado"). O pin falha (exit 2, lock INCOMPLETO
          # nomeado) se o bloco sumir — o job nao monta matrix com
          # numero chutado.
          N=$(python3 ci/pins_do_lock.py --amostragem-n)
          lista="["
          i=1
          while [ "$i" -le "$N" ]; do
            [ "$i" -gt 1 ] && lista="$lista,"
            lista="$lista\"copia-$i\""
            i=$((i+1))
          done
          echo "lista=$lista]" >> "$GITHUB_OUTPUT"
          echo "copias: $lista] (N do lock: $N — CP-013/CP-015, decisão (e) + janela móvel)"

      # CP-011: quem declara audio, lido do PROPRIO filme (nunca lista de
      # nomes); e se este PR acorda o job caro. Acordam o job: mudanca em
      # caminho que assina bytes (lock, amostras, cadeia, imagem, prova) OU
      # no filme.js de filme que DECLARA audio. Um filme mudo nao aciona.
      - id: filtro
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENTO: ${{ github.event_name }}
        shell: bash
        run: |
          python3 - <<'EOF' | tee /tmp/planejar.log
          import os, subprocess, sys
          sys.path.insert(0, ".")
          from estudio_suite.comum import dados_do_filme, filmes_existentes

          com_audio = []
          for fid in filmes_existentes():
              try:
                  if dados_do_filme(fid).get("audio"):
                      com_audio.append(fid)
              except Exception:
                  pass          # ilegivel ja foi apontado no stderr da leitura
          print(f"filmes={' '.join(com_audio)}")

          if os.environ.get("EVENTO") != "pull_request":
              print("rodar=true")
              print("motivo=dispatch manual — prova em: " + (", ".join(com_audio) or "nenhum filme declara audio"))
          else:
              base, head = os.environ["BASE_SHA"], os.environ["HEAD_SHA"]
              muda = subprocess.run(
                  ["git", "diff", "--name-only", f"{base}...{head}"],
                  capture_output=True, text=True).stdout.split()
              assina = any(
                  p in ("voz.lock", "amostras.lock",
                        "ci/pins_do_lock.py", "ci/prova_por_classe.py",
                        "ci/agregar_prova.py", "ci/veredito_da_copia.py",
                        "ci/observacao_ancora.py", "ci/observar_avx2.py",
                        "ci/independencia.py", "ci/rotear_segunda_onda.py",
                        "ci/atualizar_registro_frota.py",
                        "harness/frota/execucoes.json",
                        "harness/frota/execucoes-gate.json",
                        ".github/workflows/dublador.yml",
                        ".github/workflows/dublador-onda.yml",
                        ".github/workflows/observar-avx2.yml")
                  or p.startswith(("estudio_suite/", "ferramentas/dublador/"))
                  for p in muda)
              com_audio_tocado = False
              for p in muda:
                  partes = p.split("/")
                  if (len(partes) == 3 and partes[0] == "filmes"
                          and partes[2].endswith(".filme.js")):
                      try:
                          if dados_do_filme(partes[1]).get("audio"):
                              com_audio_tocado = True
                      except Exception:
                          pass
              rodar = assina or com_audio_tocado
              print(f"rodar={'true' if rodar else 'false'}")
              motivo = []
              if assina:
                  motivo.append("caminho que assina bytes de audio mudou")
              if com_audio_tocado:
                  motivo.append("filme.js de filme que declara audio mudou")
              if not motivo:
                  motivo.append("PR sem mudanca que assina audio e sem filme "
                                "com audio — filme mudo NAO aciona o job (CP-011)")
              print("motivo=" + "; ".join(motivo))
          EOF
          while IFS= read -r linha; do
            case "$linha" in
              filmes=*)  echo "${linha}"   >> "$GITHUB_OUTPUT" ;;
              rodar=*)   echo "${linha}"   >> "$GITHUB_OUTPUT" ;;
              motivo=*)  echo "${linha}"   >> "$GITHUB_OUTPUT" ;;
            esac
          done < <(grep -E '^(filmes|rodar|motivo)=' /tmp/planejar.log)
          echo "== filtro (CP-011): $(grep '^motivo=' /tmp/planejar.log | cut -d= -f2-)"

  # CP-015: a ONDA 1 — o workflow reutilizável dublador-onda.yml com a
  # matrix do lock. O corpo da cópia mora LÁ (um só lugar para as duas
  # ondas): classificação, saída cedo da avx2, build e prova completa da
  # avx512, veredito/identidade rotulados com o número da onda.
  dublador-onda1:
    needs: planejar
    if: needs.planejar.outputs.rodar == 'true'
    uses: ./.github/workflows/dublador-onda.yml
    with:
      copias: ${{ needs.planejar.outputs.copias }}
      filmes: ${{ needs.planejar.outputs.filmes }}
      onda: 1

  # CP-015: O ROTEADOR — olha a onda 1 e decide se a segunda acorda.
  # Roda com if: always() (a onda 1 pode ter cópia vermelha — o roteador
  # não decide o veredito, só a ROTA). A regra é UMA: segunda onda acorda
  # se e somente se TODAS as cópias esperadas da onda 1 são legíveis e
  # TODAS são avx2 — zero AVX-512 no sorteio. Com qualquer AVX-512
  # (idêntica, divergente ou nao-provou), com artefato ausente ou
  # corrompido: NÃO acorda — esses estados são do AGREGADOR, e a segunda
  # onda não existe para mascarar cópia ilegível (ilegível reprova,
  # nunca vira outra sorte).
  rotear:
    needs: [planejar, dublador-onda1]
    if: always() && needs.planejar.outputs.rodar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      segunda_onda: ${{ steps.rotear.outputs.segunda_onda }}
    steps:
      - uses: actions/checkout@v4

      - name: Baixar os vereditos da onda 1
        uses: actions/download-artifact@v4
        with:
          pattern: identidade-onda1-*
          path: /tmp/amostras1
          # merge-multiple: false (default) — cada artefato no seu
          # subdiretório (identidade-onda1-<copia>-run<id>/veredito.json)

      - id: rotear
        name: O roteador da segunda onda (CP-015)
        shell: bash
        run: |
          set -o pipefail
          python3 ci/rotear_segunda_onda.py \
            --artefatos /tmp/amostras1 \
            --copias '${{ needs.planejar.outputs.copias }}' \
            --saida /tmp/rotear | tee /tmp/rotear/rotear.log

      - name: Publicar a rota (verde também)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotear-segunda-onda-run${{ github.run_id }}
          path: /tmp/rotear/

  # CP-015: a ONDA 2 — automática (decisão do dono): a MESMA matrix N,
  # os MESMOS passos da onda 1, o número da onda diferente no veredito e
  # no artefato. "Rerun humano deixa de ser o caminho de volta": quando o
  # sorteio da frota não traz NENHUMA AVX-512, a resposta é tentar de
  # novo NO MESMO RUN — P(uma onda vazia) ~ 1,77% com N=13 e a fração da
  # janela; P(duas vazias) ~ 0,0315%. Se o roteador não acordar a onda 2
  # (estado que não é do sorteio), este job é pulado e o agregador nomeia
  # o que houver.
  dublador-onda2:
    needs: [planejar, rotear]
    if: needs.rotear.outputs.segunda_onda == 'true'
    uses: ./.github/workflows/dublador-onda.yml
    with:
      copias: ${{ needs.planejar.outputs.copias }}
      filmes: ${{ needs.planejar.outputs.filmes }}
      onda: 2

  # CP-013/CP-015: O AGREGADOR — o veredito do RUN não é de cópia nenhuma,
  # é da AMOSTRAGEM SOBRE AS ONDAS DECLARADAS. Um job final lê os
  # artefatos de TODAS as cópias de TODAS as ondas (o veredito.json de
  # cada uma, baixado por pattern — cada artefato no seu subdiretório,
  # o campo "onda" distingue onda-1/copia-3 de onda-2/copia-3) e decide:
  #
  #   VERDE                 >= 1 cópia AVX-512 com PCM idêntico E zero
  #                         cópias AVX-512 divergentes E zero ilegíveis
  #                         (em qualquer onda)
  #   DIVERGENCIA_AVX512    qualquer cópia AVX-512 divergente — com o
  #                         NOME da ONDA, da cópia e os números
  #   SEM_AMOSTRA_DECISIVA  zero cópias AVX-512 em TODAS as ondas. Com a
  #                         segunda onda automática, só nasce após DUAS
  #                         ondas vazias (P = 0,0315%) — e segue vermelho
  #                         nomeado: o caminho automático já rodou; o que
  #                         resta é revisar o N da janela ou o rerun
  #   AMOSTRA_ILEGIVEL      cópia sem artefato, corrompida, classe
  #                         indeterminada, AVX-512 que não provou, onda
  #                         declarada que não entregou, ou matrix que não
  #                         veio do lock — reprova, nunca conta como neutra
  #
  # As cópias avx2 (veredito "observacao") são NEUTRAS: não decidem,
  # não bloqueiam, aparecem no resumo porque a observação é pública.
  # O resumo do job lista onda, cópia, CPU, classe, prova e veredito
  # (GITHUB_STEP_SUMMARY), o agregado.json vai para o artefato — e o
  # campo REGISTRO dele (com as ondas) é o que alimenta
  # harness/frota/execucoes-gate.json por PR de manutenção
  # (ci/atualizar_registro_frota.py no clone do curador; commit
  # automático no main, JAMAIS).
  # needs: ondas + roteador + always(): o agregador roda mesmo com cópia
  # vermelha — é ele quem NOMEIA quem divergiu; e o --conferir-n fecha
  # o círculo do "um lugar só": a matrix conferida contra o lock, por
  # onda.
  agregar:
    needs: [planejar, dublador-onda1, rotear, dublador-onda2]
    if: always() && needs.planejar.outputs.rodar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Baixar os vereditos de todas as cópias de todas as ondas
        uses: actions/download-artifact@v4
        with:
          pattern: identidade-*
          path: /tmp/amostras
          # merge-multiple: false (default) — cada artefato no seu
          # subdiretório (identidade-onda<o>-<copia>-run<id>/veredito.json),
          # senão os arquivos de mesmo nome se sobrescreveriam

      - name: O agregador da prova por amostragem (CP-013; ondas CP-015)
        env:
          # o head do PR para o registro: no evento pull_request o
          # GITHUB_SHA é o commit de MERGE — o head_do_pr é registrado
          # junto (a fronteira da CP-014, medida e declarada)
          GITHUB_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/agregado
          ONDAS='1'
          if [ "${{ needs.rotear.outputs.segunda_onda }}" = "true" ]; then
            ONDAS='1,2'
          fi
          echo "== ondas declaradas deste run: $ONDAS"
          python3 ci/agregar_prova.py \
            --artefatos /tmp/amostras \
            --copias '${{ needs.planejar.outputs.copias }}' \
            --ondas "$ONDAS" \
            --conferir-n \
            --saida /tmp/agregado | tee /tmp/agregado/agregado.log

      - name: Publicar o agregado (vermelho também)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agregado-frota-run${{ github.run_id }}
          path: /tmp/agregado/
